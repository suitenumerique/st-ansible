---
# Automatically generated by aar-doc
# UID of the `transfers` user, used for the podman role.
st_transfers_uid: 1107
# GID of the `transfers` group, used for the podman role.
st_transfers_gid: '{{ st_transfers_uid }}'
# Image repository for the transfers frontend.
st_transfers_frontend_image: ghcr.io/suitenumerique/transfers-frontend
# Image repository for the transfers backend.
st_transfers_backend_image: ghcr.io/suitenumerique/transfers-backend
# Tag of the transfers docker images to deploy.
st_transfers_tag: 0.1.0
# Triggers the installation of the transfers application.
st_transfers_enabled: false
# Remote path to the base directory for transfers app.
st_transfers_dir: /opt/transfers/transfers
# The host published port for the transfers frontend (maps to the container's Caddy port 8080).
st_transfers_port: '50700'
# Whether or not to trigger the rollback tasks if the transfers deployment fails.
st_transfers_rollback_enabled: false
# Local path to the custom template to use for transfers compose file.
st_transfers_compose_template: transfers/compose.yaml.j2
# Local path to the custom template to use for transfers backend env file.
st_transfers_backend_env_template: transfers/backend_env.j2
# Content of the default backend_env_template, not used if st_transfers_backend_env_template is defined.
st_transfers_backend_env: ''
# Whether to run database migrations on transfers backend startup.
st_transfers_backend_run_migrations: true
# Local path to the custom template to use for transfers frontend env file.
st_transfers_frontend_env_template: transfers/frontend_env.j2
# Content of the default frontend_env_template, not used if st_transfers_frontend_env_template is defined.
st_transfers_frontend_env: ''
# Triggers the installation of the transfers workers (Celery worker with embedded beat scheduler).
st_transfers_workers_enabled: false
# Remote path to the base directory for transfers workers.
st_transfers_workers_dir: /opt/transfers/workers
# Local path to the custom template to use for transfers workers env file.
st_transfers_workers_env_template: workers/env.j2
# Content of the default workers_env_template, not used if st_transfers_workers_env_template is defined.
st_transfers_workers_env: '{{ st_transfers_backend_env }}'
# Whether or not to trigger the rollback tasks if the workers deployment fails.
st_transfers_workers_rollback_enabled: false
# Local path to the custom template to use for workers compose file.
st_transfers_workers_compose_template: workers/compose.yaml.j2
# Triggers the installation of the cadvisor container, a Prometheus-compliant containers monitoring tool.
st_transfers_cadvisor_enabled: false
# Image repository for the cadvisor container.
st_transfers_cadvisor_image: ghcr.io/google/cadvisor
# Tag of the cadvisor docker image to deploy.
st_transfers_cadvisor_tag: v0.60.3
# The host published port of the cadvisor container.
st_transfers_cadvisor_port: '127.0.0.1:50799'
