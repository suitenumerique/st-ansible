---
# Automatically generated by aar-doc
# UID of the `drive` user, used for the podman role.
st_drive_uid: 1101
# GID of the `drive` group, used for the podman role.
st_drive_gid: '{{ st_drive_uid }}'
# Image repository for the drive frontend.
st_drive_frontend_image: docker.io/lasuite/drive-frontend
# Image repository for the drive backend.
st_drive_backend_image: docker.io/lasuite/drive-backend
# Tag of the drive docker images to deploy.
st_drive_tag: v0.22.0
# Triggers the installation of the drive application.
st_drive_enabled: false
# Remote path to the base directory for drive app.
st_drive_dir: /opt/drive/drive
# The host published port for the drive caddy edge.
st_drive_port: '50100'
# Whether or not to trigger the rollback tasks if the drive deployment fails.
st_drive_rollback_enabled: false
# Local path to the custom template to use for drive compose file.
st_drive_compose_template: drive/compose.yaml.j2
# Local path to the custom template to use for drive backend env file.
st_drive_backend_env_template: drive/backend_env.j2
# Content of the default backend_env_template, not used if st_drive_backend_env_template is defined.
st_drive_backend_env: ''
# Whether to run database migrations on drive backend startup.
st_drive_backend_run_migrations: true
# Local path to the custom template to use for drive frontend env file.
st_drive_frontend_env_template: drive/frontend_env.j2
# Content of the default frotnend_env_template, not used if st_drive_frotnend_env_template is defined.
st_drive_frontend_env: ''
# Local path to the custom template to use for drive caddy env file.
st_drive_caddy_env_template: drive/caddy_env.j2
# Content of the default caddy_env_template, not used if st_drive_caddy_env_template is defined. The Caddyfile requires CADDY_S3_PROTOCOL, CADDY_S3_HOST and CADDY_S3_BUCKET.
st_drive_caddy_env: ''
# Image repository for the drive caddy reverse-proxy.
st_drive_caddy_image: docker.io/caddy
# The tag of the caddy docker image to use.
# See https://hub.docker.com/_/caddy/tags.
st_drive_caddy_tag: 2.11.4-alpine
# Triggers the installation of the drive workers
st_drive_workers_enabled: false
# Remote path to the base directory for drive workers.
st_drive_workers_dir: /opt/drive/workers
# Local path to the custom template to use for drive workers env file.
st_drive_workers_env_template: workers/env.j2
# Content of the default workers_env_template, not used if st_drive_workers_env_template is defined.
st_drive_workers_env: '{{ st_drive_backend_env }}'
# Whether or not to trigger the rollback tasks if the workers deployment fails.
st_drive_workers_rollback_enabled: false
# Local path to the custom template to use for workers compose file.
st_drive_workers_compose_template: workers/compose.yaml.j2
# Triggers the installation of collabora.
st_drive_collabora_enabled: false
# Image repository for collabora.
st_drive_collabora_image: docker.io/collabora/code
# Tag of the collabora docker image to deploy.
st_drive_collabora_tag: 26.04.3.2.1
# Remote path to the base directory for collabora app.
st_drive_collabora_dir: /opt/drive/collabora
# Local path to the custom template to use for collabora env file.
st_drive_collabora_env_template: collabora/env.j2
# Whether or not to trigger the rollback tasks if the collabora deployment fails.
st_drive_collabora_rollback_enabled: false
# Local path to the custom template to use for collabora compose file.
st_drive_collabora_compose_template: collabora/compose.yaml.j2
# The port to open on the host, redirecting to port 9980 in the container. It can also specify the ip address, something like 127.0.0.1:9980.
st_drive_collabora_port: '50101'
# Triggers the installation of the cadvisor container, a Prometheus-compliant containers monitoring tool.
st_drive_cadvisor_enabled: false
# Image repository for the cadvisor container.
st_drive_cadvisor_image: ghcr.io/google/cadvisor
# Tag of the cadvisor docker image to deploy.
st_drive_cadvisor_tag: v0.60.3
# The host published port of the cadvisor container.
st_drive_cadvisor_port: '127.0.0.1:50199'
