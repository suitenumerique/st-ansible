---
argument_specs:
  main:
    short_description: "Installs and configures the podman rootless base for La Suite Territoriale applications on Debian systems."
    options:
      st_podman_unprivileged_port_start:
        type: "str"
        description: "Port number to pass to sysctl net.ipv4.ip_unprivileged_port."
      st_podman_user:
        type: "str"
        description: "The unix user that will be configured to manage the podman rootless containers."
        required: true
      st_podman_group:
        type: "str"
        description: "The unix group of st_podman_user."
        default: "{{ st_podman_user }}"
      st_podman_home:
        type: "str"
        description: "The home of st_podman_user."
        default: "/opt/{{ st_podman_user }}"
      st_podman_uid:
        type: "int"
        description: "A custom UID for st_podman_user."
      st_podman_gid:
        type: "int"
        description: "A custom GID for st_podman_group."
      st_podman_containers_config_template:
        type: "str"
        description:
          - "Local path to the template for the containers.conf configuration file."
          - "This file will be put under st_podman_user homedir."
        default: "containers.conf.j2"
      st_podman_tz:
        type: "str"
        description: "Sets the default timezone for all containers, in the default containers.conf template."
        default: "UTC"
      st_podman_compose_version:
        type: "str"
        description:
          - "The Debian package version of podman-compose that the role installs."
          - "The role fetches the package from snapshot.debian.org, which keeps every version that entered the Debian archive."
          - "Versions 1.5.0 and later exec a `CMD` healthcheck without `/bin/sh`, which images without a shell need. Trixie ships 1.3.0."
        # The role turns the version into a file hash with
        # https://snapshot.debian.org/mr/binary/podman-compose/<version>/binfiles,
        # then downloads https://snapshot.debian.org/file/<hash>.
        # renovate: datasource=deb depName=podman-compose versioning=deb
        default: "1.6.0-1"
      st_podman_compose_deb_url:
        type: "str"
        description:
          - "The URL of a podman-compose Debian package to install instead of the snapshot.debian.org file."
          - "Set it with `st_podman_compose_deb_checksum` when the hosts have no access to snapshot.debian.org. The package must have the version `st_podman_compose_version`."
        default: ""
      st_podman_compose_deb_checksum:
        type: "str"
        description:
          - "The checksum of the package at `st_podman_compose_deb_url`, in the `get_url` format, for example `sha256:<hex>`."
          - "Required when `st_podman_compose_deb_url` is set."
        default: ""
      st_podman_registries:
        type: "list"
        elements: "dict"
        description: "List of container registries to connect to podman user onto."
      st_podman_registries_config_template:
        type: "str"
        description: "The ansible template for registries.conf. See https://github.com/containers/image/blob/main/docs/containers-registries.conf.5.md"
      st_podman_application_name:
        type: "str"
        description:
          - "The name of the application to deploy."
          - "This is used mainly for the systemd unit filename and the default application_dir."
        default: ""
      st_podman_application_dir:
        type: "str"
        description: "The base directory to deploy the application compose to."
        default: "{{ st_podman_home }}/{{ st_podman_application_name }}"
      st_podman_application_dir_mode:
        type: "str"
        description: "The permissions to apply to the base directory to deploy the application compose to."
        default: "0750"
      st_podman_application_directories:
        type: "list"
        elements: "dict"
        description:
          - "Additional directories for files needed for deployment."
          - "Will be used to put `st_podman_application_files` inside."
      st_podman_application_files:
        type: "list"
        elements: "dict"
        description:
          - "Additional files needed for deployment."
          - "Could be an env file, a configuration file mounted in the container or anything else."
          - "If in a subdirectory, the directory has to be created with `st_podman_application_directories` first."
          - "Each item has `dest`, and one of `src` (a template) or `content` (an inline string)."
          - "Optional item keys are `mode`, `template`, `container_uid`, `container_gid`, `when` and `no_log`."
          - "Set `no_log` to true to hide the file value from the task output and the diff. The default is false."
      st_podman_application_secret_files:
        type: "list"
        elements: "dict"
        description:
          - "Secret files to deploy in the `secrets` directory of the application."
          - "Each item has `env` in UPPER_SNAKE_CASE, and one of `src` (a template) or `content` (an inline string)."
          - "The role writes the item to `secrets/<env>` with mode 0440, and hides its value from the task output."
          - "The role deletes the other files in `secrets`. It deletes the directory when the list is empty."
          - "The compose template must mount `secrets` in the container and set the `<env>_FILE` variable."
          - "The role manages `secrets` only when this variable is defined. An application that does not set it keeps its `secrets` directory."
          - "The name `secrets` is reserved. `st_podman_application_directories` and `st_podman_application_files` must not use it."
      st_podman_application_secret_files_container_uid:
        type: "str"
        description:
          - "The owner uid, inside the container, of the `secrets` directory and of each secret file."
          - "Set it to the uid of the container user that reads the secret files."
          - "The container gid stays 0 (the application user on the host)."
          - "When the uid is not 0, the `secrets` directory has mode 2770 and the application user keeps write access through the group."
        default: "0"
      st_podman_application_compose_template:
        type: "str"
        description: "Local path to the docker compose template for the application."
      st_podman_application_restart_policy:
        type: "str"
        description: "The restart policy to apply to the systemd unit of the application."
        default: "on-abnormal"
        choices:
          - "no"
          - "on-success"
          - "on-failure"
          - "on-abnormal"
          - "on-watchdog"
          - "on-abort"
          - "always"
      st_podman_application_rollback_enabled:
        type: "bool"
        description: "Whether or not to trigger the rollback tasks if the deployment fails."
        default: false
      st_podman_application_timeout:
        type: "int"
        description: "The timeout for starting the application compose."
        default: 300
