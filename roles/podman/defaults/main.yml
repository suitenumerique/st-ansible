---
# Automatically generated by aar-doc
# The unix group of st_podman_user.
st_podman_group: '{{ st_podman_user }}'
# The home of st_podman_user.
st_podman_home: /opt/{{ st_podman_user }}
# Local path to the template for the containers.conf configuration file.
# This file will be put under st_podman_user homedir.
st_podman_containers_config_template: containers.conf.j2
# Sets the default timezone for all containers, in the default containers.conf template.
st_podman_tz: UTC
# The Debian package version of podman-compose that the role installs.
# The role fetches the package from snapshot.debian.org, which keeps every version that entered the Debian archive.
# Versions 1.5.0 and later exec a `CMD` healthcheck without `/bin/sh`, which images without a shell need. Trixie ships 1.3.0.
st_podman_compose_version: 1.6.0-1
# The URL of a podman-compose Debian package to install instead of the snapshot.debian.org file.
# Set it with `st_podman_compose_deb_checksum` when the hosts have no access to snapshot.debian.org. The package must have the version `st_podman_compose_version`.
st_podman_compose_deb_url: ''
# The checksum of the package at `st_podman_compose_deb_url`, in the `get_url` format, for example `sha256:<hex>`.
# Required when `st_podman_compose_deb_url` is set.
st_podman_compose_deb_checksum: ''
# The name of the application to deploy.
# This is used mainly for the systemd unit filename and the default application_dir.
st_podman_application_name: ''
# The base directory to deploy the application compose to.
st_podman_application_dir: '{{ st_podman_home }}/{{ st_podman_application_name }}'
# The permissions to apply to the base directory to deploy the application compose to.
st_podman_application_dir_mode: '0750'
# The restart policy to apply to the systemd unit of the application.
st_podman_application_restart_policy: on-abnormal
# Whether or not to trigger the rollback tasks if the deployment fails.
st_podman_application_rollback_enabled: false
# The timeout for starting the application compose.
st_podman_application_timeout: 300
