---
# INFO: Example list:
# st_podman_application_secret_files:
#   - env: DB_PASSWORD          # written to secrets/DB_PASSWORD
#     content: "{{ vault_db_password }}"
#   - env: JWT_PRIVATE_KEY      # written to secrets/JWT_PRIVATE_KEY
#     src: jwt_private_key.pem.j2
#
# NOTE: The role manages `secrets/` only when st_podman_application_secret_files is defined.
# application.yml rejects the reserved name `secrets` before the generic directories and files loops.
# When the container user is not root, the host user keeps write access through the group (2770),
# because it cannot write in a directory that a subuid owns with mode 2750.
- name: "Manage {{ st_podman_application_name }} application secret files."
  when: st_podman_application_secret_files is defined
  vars:
    _secret_files: "{{ st_podman_application_secret_files | default([], true) }}"
    _secret_names: "{{ _secret_files | map(attribute='env', default='') | list }}"
    _secret_uid: "{{ st_podman_application_secret_files_container_uid | default(0, true) }}"
    _secret_dir_mode: "{{ '2750' if _secret_uid | string == '0' else '2770' }}"
  block:
    - name: "Assert {{ st_podman_application_name }} application secret files are valid."
      ansible.builtin.assert:
        that:
          - _secret_files[item].env is defined
          - _secret_files[item].env is string
          - _secret_files[item].env is match('^[A-Z][A-Z0-9_]*$')
          - (_secret_files[item].src is defined) != (_secret_files[item].content is defined)
        quiet: true
        fail_msg: "Secret file {{ _secret_files[item].env | default('<no env>') }} needs an env in UPPER_SNAKE_CASE and exactly one of src or content."
      loop: "{{ range(_secret_files | length) | list }}"
      loop_control:
        label: "{{ _secret_files[item].env | default('<no env>') }}"

    - name: "Assert {{ st_podman_application_name }} application secret file env names are unique."
      ansible.builtin.assert:
        that:
          - _secret_names | unique | length == _secret_names | length
        quiet: true
        fail_msg: "Two secret files have the same env."

    - name: "Ensure {{ st_podman_application_name }} application secrets directory."
      ansible.builtin.include_tasks: application/directories.yml
      loop:
        - name: secrets
          mode: "{{ _secret_dir_mode }}"
          container_uid: "{{ _secret_uid }}"
      when: _secret_files | length > 0

    - name: "Ensure {{ st_podman_application_name }} application secret files."
      ansible.builtin.include_tasks: application/files.yml
      loop: "{{ _secret_files | zip(_secret_dests) | map('combine') | map('combine', {'container_uid': _secret_uid, 'container_gid': 0}) | list }}"
      loop_control:
        label: "{{ item.dest }}"
      no_log: true
      when: _secret_files | length > 0
      vars:
        _secret_dests: >-
          {{ _secret_names | map('regex_replace', '^(.*)$', '{"dest": "secrets/\1", "mode": "0440", "no_log": true}') | map('from_json') | list }}

    - name: "Delete stale {{ st_podman_application_name }} application secret files."
      ansible.builtin.command:
        cmd: >-
          podman unshare find "{{ st_podman_application_dir }}/secrets" -mindepth 1 -maxdepth 1
          {{ _secret_names | map('regex_replace', '^(.*)$', '! -name \1') | join(' ') }} -print -exec rm -rf -- {} +
      register: _stale_secrets
      changed_when: _stale_secrets.stdout | length > 0
      when: _secret_files | length > 0
      notify:
        - "systemctl --user restart {{ st_podman_application_name }}"

    - name: "Check {{ st_podman_application_name }} application secrets directory for removal."
      ansible.builtin.stat:
        path: "{{ st_podman_application_dir }}/secrets"
      register: _secrets_dir
      when: _secret_files | length == 0

    - name: "Delete {{ st_podman_application_name }} application secrets directory."
      ansible.builtin.command:
        cmd: 'podman unshare rm -rf "{{ st_podman_application_dir }}/secrets"'
      changed_when: true
      when:
        - _secret_files | length == 0
        - _secrets_dir.stat.exists
      notify:
        - "systemctl --user restart {{ st_podman_application_name }}"
