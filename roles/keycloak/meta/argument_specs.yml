---
argument_specs:
  main:
    short_description: "Installs and configures the keycloak application from La Suite Territoriale on Debian systems."
    options:
      st_keycloak_uid:
        type: "int"
        description: "UID of the `keycloak` user, used for the podman role."
        default: 1102
      st_keycloak_gid:
        type: "int"
        description: "GID of the `keycloak` group, used for the podman role."
        default: "{{ st_keycloak_uid }}"
      st_keycloak_registries:
        type: "list"
        elements: "dict"
        description: "Optional private container registries to login the `keycloak` user onto."
      st_keycloak_enabled:
        type: "bool"
        description: "Triggers the installation of keycloak."
        default: false
      st_keycloak_image:
        type: "str"
        description: "Image repository for keycloak."
        default: "ghcr.io/suitenumerique/messages-keycloak"
      st_keycloak_tag:
        type: "str"
        description: "Tag of the keycloak docker image to deploy."
        # renovate: datasource=github-releases depName=suitenumerique/messages versioning=semver extractVersion=^v(?<version>.+)$
        default: "0.5.0"
      st_keycloak_env_template:
        type: "str"
        description: "Local path to the custom template to use for keycloak env file."
        default: "keycloak/env.j2"
      st_keycloak_env:
        type: "str"
        description: "Content of the default keycloak_env_template, not used if st_keycloak_env_template is defined."
      st_keycloak_compose_template:
        type: "str"
        description: "Local path to the custom template to use for keycloak compose file."
        default: keycloak/compose.yaml.j2
      st_keycloak_port:
        type: "str"
        description: "Host port Keycloak listens on when running with network_mode: host."
        default: "50200"
      st_keycloak_start_command:
        type: "str"
        description: "When using the default compose template, specify the `command` to use to start keycloak."
        default: "start --optimized"
      st_keycloak_rollback_enabled:
        type: "bool"
        description: "Whether or not to trigger the rollback tasks if the keycloak deployment fails."
        default: false
      st_keycloak_cadvisor_enabled:
        type: "bool"
        description: "Triggers the installation of the cadvisor container, used to send metrics to a Prometheus compatible server and logs to a Loki server."
        default: false
      st_keycloak_cadvisor_image:
        type: "str"
        description: "Image repository for the cadvisor container."
        default: "ghcr.io/google/cadvisor"
      st_keycloak_cadvisor_tag:
        type: "str"
        description: "Tag of the cadvisor docker image to deploy."
        # renovate: datasource=docker depName=ghcr.io/google/cadvisor
        default: "v0.60.5"
      st_keycloak_cadvisor_port:
        type: "str"
        description: "The host published port of the cadvisor container."
        default: "127.0.0.1:50299"
