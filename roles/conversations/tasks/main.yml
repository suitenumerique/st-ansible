---
- name: "Import Suite Territoriale podman role."
  ansible.builtin.import_role:
    name: suitenumerique.st.podman
  vars:
    st_podman_user: "conversations"
    st_podman_uid: "{{ st_conversations_uid }}"
    st_podman_gid: "{{ st_conversations_gid }}"
    st_podman_registries: "{{ st_conversations_registries | default([]) }}"

- name: "Deploy conversations."
  ansible.builtin.import_tasks: deploy.yml
