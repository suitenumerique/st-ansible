---
- name: "Deploy conversations."
  ansible.builtin.import_tasks: deploy/conversations.yml
  when: st_conversations_enabled
  tags: ['conversations_conversations']

- name: "Deploy conversations workers."
  ansible.builtin.import_tasks: deploy/workers.yml
  when: st_conversations_workers_enabled
  tags: ['conversations_workers']

- name: "Create cadvisor application."
  when: st_conversations_cadvisor_enabled
  tags: ['conversations_cadvisor']
  ansible.builtin.import_role:
    name: suitenumerique.st.podman
    tasks_from: application.yml
  vars:
    st_podman_user: "conversations"
    st_podman_application_name: "cadvisor"
    st_podman_application_compose_template: monitoring/compose_cadvisor.yaml.j2
