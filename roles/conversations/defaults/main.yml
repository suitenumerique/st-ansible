---
# Automatically generated by aar-doc
# UID of the `conversations` user, used for the podman role.
st_conversations_uid: 1109
# GID of the `conversations` group, used for the podman role.
st_conversations_gid: '{{ st_conversations_uid }}'
# Image repository for the conversations frontend.
st_conversations_frontend_image: docker.io/lasuite/conversations-frontend
# Image repository for the conversations backend.
st_conversations_backend_image: docker.io/lasuite/conversations-backend
# Tag of the conversations docker images to deploy.
st_conversations_tag: v0.0.24
# Triggers the installation of the conversations application.
st_conversations_enabled: false
# Remote path to the base directory for conversations app.
st_conversations_dir: /opt/conversations/conversations
# The host published port for the conversations caddy edge.
st_conversations_port: '50900'
# Whether or not to trigger the rollback tasks if the conversations deployment fails.
st_conversations_rollback_enabled: false
# Local path to the custom template to use for conversations compose file.
st_conversations_compose_template: conversations/compose.yaml.j2
# Local path to the custom template to use for conversations backend env file.
st_conversations_backend_env_template: conversations/backend_env.j2
# Content of the default backend_env_template, not used if st_conversations_backend_env_template is defined.
st_conversations_backend_env: ''
# Whether to run database migrations on conversations backend startup.
st_conversations_backend_run_migrations: true
# Local path to the custom template to use for conversations caddy env file.
st_conversations_caddy_env_template: conversations/caddy_env.j2
# Content of the default caddy_env_template, not used if st_conversations_caddy_env_template is defined. Every key is optional: CADDY_ADMIN_IP_ALLOWLIST (space-separated CIDR list of client IPs allowed on the Django admin URL, default allows all) and CADDY_TRUSTED_PROXIES (space-separated CIDR list of proxies whose X-Forwarded-For sets the client IP, default private_ranges).
st_conversations_caddy_env: ''
# Image repository for the conversations caddy reverse-proxy.
st_conversations_caddy_image: docker.io/caddy
# The tag of the caddy docker image to use.
# See https://hub.docker.com/_/caddy/tags.
st_conversations_caddy_tag: 2.11.4-alpine
# Local path of an LLM model catalog JSON. When set, the role mounts it read-only over `/app/conversations/configuration/llm/default.json` in the backend container. The backend caches the catalog at boot.
st_conversations_llm_configuration_src: ''
# Local path of a theme customization JSON. When set, the role mounts it read-only over `/app/conversations/configuration/theme/default.json` in the backend container.
st_conversations_theme_customization_src: ''
# Triggers the installation of the conversations workers
st_conversations_workers_enabled: false
# Remote path to the base directory for conversations workers.
st_conversations_workers_dir: /opt/conversations/workers
# Local path to the custom template to use for conversations workers env file.
st_conversations_workers_env_template: workers/env.j2
# Content of the default workers_env_template, not used if st_conversations_workers_env_template is defined.
st_conversations_workers_env: '{{ st_conversations_backend_env }}'
# Whether or not to trigger the rollback tasks if the workers deployment fails.
st_conversations_workers_rollback_enabled: false
# Local path to the custom template to use for workers compose file.
st_conversations_workers_compose_template: workers/compose.yaml.j2
# Triggers the installation of the cadvisor container, a Prometheus-compliant containers monitoring tool.
st_conversations_cadvisor_enabled: false
# Image repository for the cadvisor container.
st_conversations_cadvisor_image: ghcr.io/google/cadvisor
# Tag of the cadvisor docker image to deploy.
st_conversations_cadvisor_tag: v0.60.3
# The host published port of the cadvisor container.
st_conversations_cadvisor_port: '127.0.0.1:50999'
