---
# Automatically generated by aar-doc
# UID of the `docs` user, used for the podman role.
st_docs_uid: 1106
# GID of the `docs` group, used for the podman role.
st_docs_gid: '{{ st_docs_uid }}'
# Triggers the installation of docs.
st_docs_enabled: false
# Remote path to the base directory for docs app.
st_docs_dir: /opt/docs/docs
# The host published port for the docs frontend.
st_docs_port: '50600'
# Image repository for the docs frontend.
st_docs_frontend_image: docker.io/lasuite/impress-frontend
# Image repository for the docs backend.
st_docs_backend_image: docker.io/lasuite/impress-backend
# Image repository for the docs y-provider collaboration server.
st_docs_yprovider_image: docker.io/lasuite/impress-y-provider
# Tag of the docs docker images to deploy.
st_docs_tag: v5.4.1
# Local path to the custom template to use for docs backend env file.
st_docs_backend_env_template: docs/backend_env.j2
# Content of the default backend_env_template, not used if st_docs_backend_env_template is defined.
st_docs_backend_env: ''
# Whether to run database migrations on docs backend startup.
st_docs_backend_run_migrations: true
# Local path to the custom template to use for docs frontend env file.
st_docs_frontend_env_template: docs/frontend_env.j2
# Content of the default frontend_env_template, not used if st_docs_frontend_env_template is defined.
st_docs_frontend_env: ''
# Local path to the custom template to use for docs caddy env file.
st_docs_caddy_env_template: docs/caddy_env.j2
# Content of the default caddy_env_template, not used if st_docs_caddy_env_template is defined. The Caddyfile requires CADDY_S3_PROTOCOL, CADDY_S3_HOST, CADDY_S3_BUCKET and CADDY_YPROVIDER_ENDPOINTS (a space-separated host:port list of y-provider upstreams, load-balanced by document room).
st_docs_caddy_env: ''
# Local path to the custom template to use for docs compose file.
st_docs_compose_template: docs/compose.yaml.j2
# Image repository for the docs caddy reverse-proxy.
st_docs_caddy_image: docker.io/caddy
# The tag of the caddy docker image to use.
# See https://hub.docker.com/_/caddy/tags.
st_docs_caddy_tag: 2.11.4-alpine
# Image repository for the docspec conversion service.
st_docs_docspec_image: ghcr.io/docspecio/api
# Tag of the docspec docker image to deploy.
st_docs_docspec_tag: 3.0.1
# Whether or not to trigger the rollback tasks if the docs deployment fails.
st_docs_rollback_enabled: false
# Local path to a custom logo file (svg) to mount over the docs frontend logo (/assets/icon-docs.svg). No validation is performed. Empty means use the image default.
st_docs_frontend_logo_src: ''
# Local path to a custom theme customization JSON file to mount over the docs backend default theme. No validation is performed. Empty means use the image default.
st_docs_theme_customization_src: ''
# Triggers the installation of the docs workers.
st_docs_workers_enabled: false
# Remote path to the base directory for docs workers.
st_docs_workers_dir: /opt/docs/workers
# Local path to the custom template to use for docs workers env file.
st_docs_workers_env_template: workers/env.j2
# Content of the default workers_env_template, not used if st_docs_workers_env_template is defined.
st_docs_workers_env: '{{ st_docs_backend_env }}'
# Whether or not to trigger the rollback tasks if the workers deployment fails.
st_docs_workers_rollback_enabled: false
# Local path to the custom template to use for workers compose file.
st_docs_workers_compose_template: workers/compose.yaml.j2
# Triggers the installation of the docs y-provider collaboration server.
st_docs_yprovider_enabled: false
# Remote path to the base directory for the y-provider app.
st_docs_yprovider_dir: /opt/docs/yprovider
# Local path to the custom template to use for y-provider env file.
st_docs_yprovider_env_template: yprovider/env.j2
# Content of the default yprovider_env_template, not used if st_docs_yprovider_env_template is defined.
st_docs_yprovider_env: ''
# Whether or not to trigger the rollback tasks if the y-provider deployment fails.
st_docs_yprovider_rollback_enabled: false
# Local path to the custom template to use for y-provider compose file.
st_docs_yprovider_compose_template: yprovider/compose.yaml.j2
# The host published port for the y-provider collaboration server.
st_docs_yprovider_port: '50601'
# Image repository for the cadvisor container.
st_docs_cadvisor_image: ghcr.io/google/cadvisor
# Tag of the cadvisor docker image to deploy.
st_docs_cadvisor_tag: v0.60.3
# Triggers the installation of the cadvisor container, used to send metrics to a Prometheus compatible server and logs to a Loki server.
st_docs_cadvisor_enabled: false
# The host published port of the cadvisor container.
st_docs_cadvisor_port: '127.0.0.1:50699'
