---
- name: "Create y-provider application."
  ansible.builtin.import_role:
    name: suitenumerique.st.podman
    tasks_from: application.yml
  vars:
    st_podman_user: "docs"
    st_podman_application_name: "yprovider"
    st_podman_application_dir: "{{ st_docs_yprovider_dir }}"
    st_podman_application_rollback_enabled: "{{ st_docs_yprovider_rollback_enabled }}"
    st_podman_application_compose_template: "{{ st_docs_yprovider_compose_template }}"
    st_podman_application_files:
      - src: "{{ st_docs_yprovider_env_template }}"
        dest: "env"
