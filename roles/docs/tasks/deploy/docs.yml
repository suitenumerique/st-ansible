---
- name: "Create docs application."
  ansible.builtin.import_role:
    name: suitenumerique.st.podman
    tasks_from: application.yml
  vars:
    st_podman_user: "docs"
    st_podman_application_name: "docs"
    st_podman_application_dir: "{{ st_docs_dir }}"
    st_podman_application_rollback_enabled: "{{ st_docs_rollback_enabled }}"
    st_podman_application_compose_template: "{{ st_docs_compose_template }}"
    st_podman_application_files:
      - src: "{{ st_docs_backend_env_template }}"
        dest: "backend_env"
      - src: "{{ st_docs_frontend_env_template }}"
        dest: "frontend_env"
      - src: "{{ st_docs_caddy_env_template }}"
        dest: "caddy_env"
      - src: "docs/Caddyfile.j2"
        dest: "Caddyfile"
      - src: "{{ st_docs_theme_customization_src }}"
        dest: "theme.json"
        template: false
        container_uid: 1001
        when: "{{ st_docs_theme_customization_src | length > 0 }}"
      - src: "{{ st_docs_frontend_logo_src }}"
        dest: "logo.svg"
        template: false
        container_uid: 1001
        when: "{{ st_docs_frontend_logo_src | length > 0 }}"

- name: "Play docs migrations."
  become: true
  become_user: "docs"
  become_method: ansible.builtin.sudo
  become_flags: "-i"
  run_once: true
  register: migration_result
  changed_when: "'No migrations to apply.' not in migration_result.stdout"
  when: st_docs_backend_run_migrations
  retries: 3
  delay: 10
  until: migration_result.rc == 0
  ansible.builtin.shell:
    chdir: "{{ st_docs_dir }}"
    cmd: |
      set -eu
      podman-compose run --rm --name docs_backend_migrations backend python manage.py migrate --noinput
