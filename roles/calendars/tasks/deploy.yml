---
- name: "Assert the Messages integration settings."
  when: st_calendars_messages_enabled | bool
  ansible.builtin.assert:
    that:
      - st_calendars_messages_api_url | length > 0
      - st_calendars_messages_channel_id | length > 0
      - st_calendars_messages_api_key | length > 0
    fail_msg: "st_calendars_messages_enabled needs st_calendars_messages_api_url, st_calendars_messages_channel_id and st_calendars_messages_api_key."
    quiet: true
  tags: ['calendars_calendars', 'calendars_workers']

- name: "Deploy calendars."
  ansible.builtin.import_tasks: deploy/calendars.yml
  when: st_calendars_enabled
  tags: ['calendars_calendars']

- name: "Deploy calendars workers."
  ansible.builtin.import_tasks: deploy/workers.yml
  when: st_calendars_workers_enabled
  tags: ['calendars_workers']

- name: "Create cadvisor application."
  when: st_calendars_cadvisor_enabled
  tags: ['calendars_cadvisor']
  ansible.builtin.import_role:
    name: suitenumerique.st.podman
    tasks_from: application.yml
  vars:
    st_podman_user: "calendars"
    st_podman_application_name: "cadvisor"
    st_podman_application_compose_template: monitoring/compose_cadvisor.yaml.j2
