---
- name: "Create calendars application."
  ansible.builtin.import_role:
    name: suitenumerique.st.podman
    tasks_from: application.yml
  vars:
    st_podman_user: "calendars"
    st_podman_application_name: "calendars"
    st_podman_application_dir: "{{ st_calendars_dir }}"
    st_podman_application_rollback_enabled: "{{ st_calendars_rollback_enabled }}"
    st_podman_application_compose_template: "{{ st_calendars_compose_template }}"
    st_podman_application_secret_files: "{{ _st_calendars_backend_secret_files }}"
    st_podman_application_files:
      - src: "{{ st_calendars_backend_env_template }}"
        dest: "backend_env"
      - src: "{{ st_calendars_caldav_env_template }}"
        dest: "caldav_env"
      - src: "{{ st_calendars_caddy_env_template }}"
        dest: "caddy_env"
      - src: "calendars/Caddyfile.j2"
        dest: "Caddyfile"

- name: "Play calendars migrations."
  become: true
  become_user: "calendars"
  become_method: ansible.builtin.sudo
  become_flags: "-i"
  run_once: true
  register: migration_result
  changed_when: "'No migrations to apply.' not in migration_result.stdout"
  when: st_calendars_backend_run_migrations
  retries: 3
  delay: 10
  until: migration_result.rc == 0
  ansible.builtin.shell:
    chdir: "{{ st_calendars_dir }}"
    cmd: |
      set -eu
      podman-compose run --rm --name calendars_backend_migrations backend python manage.py migrate --noinput

# INFO: The CalDAV server tables live in the same database, outside the Django migrations.
# The script creates them on the first run, then applies the SQL migrations of the image.
- name: "Play calendars CalDAV server database schema."
  become: true
  become_user: "calendars"
  become_method: ansible.builtin.sudo
  become_flags: "-i"
  run_once: true
  register: caldav_schema_result
  changed_when: "'tables already exist' not in caldav_schema_result.stdout"
  when: st_calendars_backend_run_migrations
  retries: 3
  delay: 10
  until: caldav_schema_result.rc == 0
  ansible.builtin.shell:
    chdir: "{{ st_calendars_dir }}"
    cmd: |
      set -eu
      podman-compose run --rm --name calendars_caldav_schema caldav /usr/local/bin/init-database.sh
