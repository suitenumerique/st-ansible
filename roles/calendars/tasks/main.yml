---
- name: "Import Suite Territoriale podman role."
  ansible.builtin.import_role:
    name: suitenumerique.st.podman
  vars:
    st_podman_user: "calendars"
    st_podman_uid: "{{ st_calendars_uid }}"
    st_podman_gid: "{{ st_calendars_gid }}"
    st_podman_registries: "{{ st_calendars_registries | default([]) }}"

- name: "Deploy calendars."
  ansible.builtin.import_tasks: deploy.yml
