---
# Automatically generated by aar-doc
# UID of the `calendars` user, used for the podman role.
st_calendars_uid: 1110
# GID of the `calendars` group, used for the podman role.
st_calendars_gid: '{{ st_calendars_uid }}'
# Image repository for the calendars frontend.
st_calendars_frontend_image: ghcr.io/suitenumerique/calendars-frontend
# Tag of the calendars frontend image to deploy.
# Upstream publishes only the mutable `main` tag, so the default pins it by digest.
st_calendars_frontend_tag: 'main@sha256:216c097eea804322df2b60247d00a7deba5e01c5a001b7809118ab4c52e82aab'
# Image repository for the calendars backend and workers.
st_calendars_backend_image: ghcr.io/suitenumerique/calendars-backend
# Tag of the calendars backend image to deploy.
# Upstream publishes only the mutable `main` tag, so the default pins it by digest.
st_calendars_backend_tag: 'main@sha256:bb5411a05a02c7ac3ea96d8ec9971fef57be026534333c134d9978bf19182cd2'
# Image repository for the calendars CalDAV server (SabreDAV).
st_calendars_caldav_image: ghcr.io/suitenumerique/calendars-caldav
# Tag of the calendars CalDAV server image to deploy.
# Upstream publishes only the mutable `main` tag, so the default pins it by digest.
st_calendars_caldav_tag: 'main@sha256:074da1f141d697d8ce0667c6fd6df3208ec70ce6af5b53537ac5dd5f2c814a57'
# Triggers the installation of the calendars application.
st_calendars_enabled: false
# Remote path to the base directory for calendars app.
st_calendars_dir: /opt/calendars/calendars
# The host published port for the calendars caddy edge.
st_calendars_port: '51000'
# Whether or not to trigger the rollback tasks if the calendars deployment fails.
st_calendars_rollback_enabled: false
# Local path to the custom template to use for calendars compose file.
st_calendars_compose_template: calendars/compose.yaml.j2
# Local path to the custom template to use for calendars backend env file.
st_calendars_backend_env_template: calendars/backend_env.j2
# Content of the default backend_env_template, not used if st_calendars_backend_env_template is defined.
st_calendars_backend_env: ''
# Secrets that the container reads from files. Each item has the key "env" (the variable name in upper case) and one of the keys "src" (local template) or "content" (inline value). The role writes the file "secrets/<env>" in the application directory. The role mounts the "secrets" directory read-only at /run/secrets. The role sets "<ENV>_FILE" in the compose environment. The "<ENV>_FILE" variable has priority over the same variable in the env content. The CalDAV server does not read these files.
st_calendars_backend_secret_files: []
# Whether to run the database migrations on deploy. The role runs the Django migrations, then the CalDAV server schema script (init-database.sh).
st_calendars_backend_run_migrations: true
# Local path to the custom template to use for calendars CalDAV server env file.
st_calendars_caldav_env_template: calendars/caldav_env.j2
# Content of the default caldav_env_template, not used if st_calendars_caldav_env_template is defined. The CalDAV server requires PGHOST, PGDATABASE, PGUSER, PGPASSWORD, CALDAV_INBOUND_API_KEY, CALDAV_OUTBOUND_API_KEY, CALDAV_INTERNAL_API_KEY and CALDAV_CALLBACK_BASE_URL. The three API keys must have the same values as in the backend env.
st_calendars_caldav_env: ''
# Turns on the Messages integration (mailbox calendars). The role sets FEATURE_MESSAGES_INTEGRATION, MESSAGES_API_URL and MESSAGES_CHANNEL_ID in the compose environment of the backend and of the worker, and gives them MESSAGES_API_KEY as a secret file. These values have priority over the same variables in the env content.
st_calendars_messages_enabled: false
# Base URL of the Messages application, for example https://messages.example.org. Required when st_calendars_messages_enabled is true.
st_calendars_messages_api_url: ''
# Id of the global api_key channel that a Messages superadmin creates for Calendars. Required when st_calendars_messages_enabled is true.
st_calendars_messages_channel_id: ''
# API key of this Messages channel. Messages shows it once, at channel creation. Required when st_calendars_messages_enabled is true.
st_calendars_messages_api_key: ''
# Local path to the custom template to use for calendars caddy env file.
st_calendars_caddy_env_template: calendars/caddy_env.j2
# Content of the default caddy_env_template, not used if st_calendars_caddy_env_template is defined. Every key is optional: CADDY_ADMIN_IP_ALLOWLIST (space-separated CIDR list of client IPs allowed on the Django admin URL, default allows all) and CADDY_TRUSTED_PROXIES (space-separated CIDR list of proxies whose X-Forwarded-For sets the client IP, default private_ranges).
st_calendars_caddy_env: ''
# Image repository for the calendars caddy reverse-proxy.
st_calendars_caddy_image: docker.io/caddy
# The tag of the caddy docker image to use.
# See https://hub.docker.com/_/caddy/tags.
st_calendars_caddy_tag: 2.11.7-alpine
# Triggers the installation of the calendars workers.
st_calendars_workers_enabled: false
# Remote path to the base directory for calendars workers.
st_calendars_workers_dir: /opt/calendars/workers
# Local path to the custom template to use for calendars workers env file.
st_calendars_workers_env_template: workers/env.j2
# Content of the default workers_env_template, not used if st_calendars_workers_env_template is defined.
st_calendars_workers_env: '{{ st_calendars_backend_env }}'
# Secrets that the container reads from files. Each item has the key "env" (the variable name in upper case) and one of the keys "src" (local template) or "content" (inline value). The role writes the file "secrets/<env>" in the application directory. The role mounts the "secrets" directory read-only at /run/secrets. The role sets "<ENV>_FILE" in the compose environment. The "<ENV>_FILE" variable has priority over the same variable in the env content. The default value is the list of the backend.
st_calendars_workers_secret_files: '{{ st_calendars_backend_secret_files }}'
# Local path to the custom template to use for the env file of the workers CalDAV server.
st_calendars_workers_caldav_env_template: workers/caldav_env.j2
# Content of the default workers_caldav_env_template, not used if st_calendars_workers_caldav_env_template is defined.
st_calendars_workers_caldav_env: '{{ st_calendars_caldav_env }}'
# Runs the Messages mailbox sync (manage.py sync_mailbox_acls) on a systemd user timer on this workers host. The timer exists only when st_calendars_messages_enabled is true. Set it to false on every workers host except one, because one run syncs every user.
st_calendars_workers_mailbox_sync_enabled: true
# Systemd OnCalendar value of the mailbox sync timer.
st_calendars_workers_mailbox_sync_timer: hourly
# Whether or not to trigger the rollback tasks if the workers deployment fails.
st_calendars_workers_rollback_enabled: false
# Local path to the custom template to use for workers compose file.
st_calendars_workers_compose_template: workers/compose.yaml.j2
# Triggers the installation of the cadvisor container, a Prometheus-compliant containers monitoring tool.
st_calendars_cadvisor_enabled: false
# Image repository for the cadvisor container.
st_calendars_cadvisor_image: ghcr.io/google/cadvisor
# Tag of the cadvisor docker image to deploy.
st_calendars_cadvisor_tag: v0.60.6
# The host published port of the cadvisor container.
st_calendars_cadvisor_port: '127.0.0.1:51099'
