---
- name: "Create projects application."
  ansible.builtin.import_role:
    name: suitenumerique.st.podman
    tasks_from: application.yml
  vars:
    st_podman_user: "projects"
    st_podman_application_name: "projects"
    st_podman_application_dir: "{{ st_projects_dir }}"
    st_podman_application_rollback_enabled: "{{ st_projects_rollback_enabled }}"
    st_podman_application_compose_template: "{{ st_projects_compose_template }}"
    st_podman_application_directories: "{{ st_projects_directories }}"
    st_podman_application_files:
      - src: "{{ st_projects_env_template }}"
        dest: "env"
