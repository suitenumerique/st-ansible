---
# Automatically generated by aar-doc
# UID of the `projects` user, used for the podman role.
st_projects_uid: 1105
# GID of the `projects` group, used for the podman role.
st_projects_gid: '{{ st_projects_uid }}'
# Triggers the installation of projects.
st_projects_enabled: false
# Remote path to the base directory for projects app.
st_projects_dir: /opt/projects/projects
# The host published port for projects (mapped to the container's 1337).
st_projects_port: '50500'
# Image repository for projects.
st_projects_image: docker.io/lasuite/projects
# Tag of the projects docker image to deploy.
st_projects_tag: 1.27.10
# Local path to the custom template to use for projects env file.
st_projects_env_template: projects/env.j2
# Content of the default env_template, not used if st_projects_env_template is defined.
st_projects_env: ''
# Local path to the custom template to use for projects compose file.
st_projects_compose_template: projects/compose.yaml.j2
# Persistent host directories bind-mounted into the projects container for user uploads (avatars, project backgrounds, attachments), owned by the container's `node` user (uid 1000). Each entry's `container_path` is the mount target inside the container; the compose template loops over this list, so overriding it changes both the created directories and the bind mounts. Empty it when every upload target is served from S3 (no upload mounts are then emitted).
st_projects_directories:
  - name: user-avatars
    container_uid: 1000
    container_path: /app/public/user-avatars
  - name: project-background-images
    container_uid: 1000
    container_path: /app/public/project-background-images
  - name: attachments
    container_uid: 1000
    container_path: /app/private/attachments
# Whether to trigger the rollback tasks if the projects deployment fails. Rollback is config-level only (it restores the previous compose/env directory, never the database). Projects runs its DB migrations unconditionally on every container start, so rolling back across a schema-changing upgrade leaves the old image running against an already-migrated database — back up the database before such an upgrade.
st_projects_rollback_enabled: false
# Triggers the installation of the cadvisor container, used to send metrics to a Prometheus compatible server and logs to a Loki server.
st_projects_cadvisor_enabled: false
# Image repository for the cadvisor container.
st_projects_cadvisor_image: ghcr.io/google/cadvisor
# Tag of the cadvisor docker image to deploy.
st_projects_cadvisor_tag: v0.60.3
# The host published port of the cadvisor container.
st_projects_cadvisor_port: '127.0.0.1:50599'
