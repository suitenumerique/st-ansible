---
- name: "Create meet egress application."
  ansible.builtin.import_role:
    name: suitenumerique.st.podman
    tasks_from: application.yml
  vars:
    st_podman_user: "meet"
    st_podman_application_name: "egress"
    st_podman_application_dir: "{{ st_meet_egress_dir }}"
    st_podman_application_rollback_enabled: "{{ st_meet_egress_rollback_enabled }}"
    st_podman_application_compose_template: "{{ st_meet_egress_compose_template }}"
    st_podman_application_files: "{{ st_meet_egress_files }}"
