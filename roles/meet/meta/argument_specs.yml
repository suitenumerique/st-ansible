---
argument_specs:
  main:
    short_description: "Installs and configures the meet application from La Suite Territoriale on Debian systems."
    options:
      st_meet_uid:
        type: "int"
        description: "UID of the `meet` user, used for the podman role."
        default: 1103
      st_meet_gid:
        type: "int"
        description: "GID of the `meet` group, used for the podman role."
        default: "{{ st_meet_uid }}"
      st_meet_registries:
        type: "list"
        elements: "dict"
        description: "Optional private container registries to login the `meet` user onto."
      st_meet_public_host:
        type: "str"
        description: "The public hostname used to access the meet application."
      st_meet_enabled:
        type: "bool"
        description: "Triggers the installation of meet."
        default: false
      st_meet_dir:
        type: "str"
        description: "Remote path to the base directory for meet app."
        default: "/opt/meet/meet"
      st_meet_port:
        type: "str"
        description: "The host published port for the meet frontend."
        default: "50300"
      st_meet_frontend_image:
        type: "str"
        description: "Image repository for the meet frontend."
        default: "docker.io/lasuite/meet-frontend"
      st_meet_backend_image:
        type: "str"
        description: "Image repository for the meet backend."
        default: "docker.io/lasuite/meet-backend"
      st_meet_tag:
        type: "str"
        description: "Tag of the meet docker image to deploy."
        # renovate: datasource=github-releases depName=suitenumerique/meet versioning=semver
        default: "v1.23.0"
      st_meet_backend_env_template:
        type: "str"
        description: "Local path to the custom template to use for meet env file."
        default: "meet/backend_env.j2"
      st_meet_backend_env:
        type: "str"
        description: "Content of the default backend_env_template, not used if st_meet_backend_env_template is defined."
        default: ""
      st_meet_backend_run_migrations:
        type: "bool"
        description: "Whether to run database migrations on meet backend startup."
        default: true
      st_meet_frontend_env_template:
        type: "str"
        description: "Local path to the custom template to use for meet frontend env file."
        default: "meet/frontend_env.j2"
      st_meet_frontend_env:
        type: "str"
        description: "Content of the default frontend_env_template, not used if st_meet_frontend_env_template is defined."
        default: ""
      st_meet_frontend_logo_src:
        type: "str"
        description: "Local path to a custom logo file (e.g. svg) to mount over the meet frontend logo. No validation is performed. Empty means use the image default."
        default: ""
      st_meet_caddy_env_template:
        type: "str"
        description: "Local path to the custom template to use for meet caddy env file."
        default: "meet/caddy_env.j2"
      st_meet_caddy_env:
        type: "str"
        description: "Content of the default caddy_env_template, not used if st_meet_caddy_env_template is defined."
        default: ""
      st_meet_compose_template:
        type: "str"
        description: "Local path to the custom template to use for meet compose file."
        default: "meet/compose.yaml.j2"
      st_meet_caddy_image:
        type: "str"
        description: "Image repository for the meet caddy reverse-proxy."
        default: "docker.io/caddy"
      st_meet_caddy_tag:
        type: "str"
        description:
          - "The tag of the caddy docker image to use."
          - "See https://hub.docker.com/_/caddy/tags."
        # renovate: datasource=docker depName=docker.io/caddy
        default: "2.11.4-alpine"
      st_meet_rollback_enabled:
        type: "bool"
        description: "Whether or not to trigger the rollback tasks if the meet deployment fails."
        default: false
      st_meet_livekit_caddyl4_image:
        type: "str"
        description: "Image repository for livekit caddyl4."
        default: "docker.io/livekit/caddyl4"
      st_meet_livekit_image:
        type: "str"
        description: "Image repository for the livekit server."
        default: "docker.io/livekit/livekit-server"
      st_meet_livekit_valkey_image:
        type: "str"
        description: "Image repository for the livekit valkey."
        default: "docker.io/valkey/valkey"
      st_meet_livekit_tag:
        type: "str"
        description: "Tag of the livekit docker image to deploy."
        # renovate: datasource=docker depName=docker.io/livekit/livekit-server
        default: "v1.13.4"
      st_meet_livekit_caddyl4_tag:
        type: "str"
        description: "Tag of the livekit caddyl4 docker image to deploy."
        # renovate: datasource=docker depName=docker.io/livekit/caddyl4
        default: "v2.11.3"
      st_meet_livekit_valkey_tag:
        type: "str"
        description: "Tag of the valkey docker image to deploy for livekit when using the full compose template."
        # renovate: datasource=docker depName=docker.io/valkey/valkey
        default: "9.0.4"
      st_meet_livekit_valkey_enabled:
        type: "bool"
        description: "Deploy a local valkey in the livekit compose (single-node co-located egress). Set false when using an external shared redis."
        default: true
      st_meet_livekit_redis_address:
        type: "str"
        description: "Redis/valkey address (host:port) the livekit server connects to. Defaults to the local valkey; set to a shared external redis when egress runs on a different node."
        default: "127.0.0.1:6379"
      st_meet_livekit_redis_username:
        type: "str"
        description: "Username for the external shared redis used by livekit and egress. Not used by the co-located local valkey, which has no auth."
        default: ""
      st_meet_livekit_redis_password:
        type: "str"
        description: "Password for the external shared redis used by livekit and egress, provided via vault. Not used by the co-located local valkey, which has no auth."
        default: ""
      st_meet_livekit_enabled:
        type: "bool"
        description: "Triggers the installation of livekit."
        default: false
      st_meet_livekit_dir:
        type: "str"
        description: "Remote path to the base directory for livekit app."
        default: "/opt/meet/livekit"
      st_meet_livekit_compose_template:
        type: "str"
        description: "Local path to the custom template to use for the livekit compose file."
        default: "livekit/compose.default.yaml.j2"
      st_meet_livekit_rollback_enabled:
        type: "bool"
        description: "Whether or not to trigger the rollback tasks if the livekit deployment fails."
        default: false
      st_meet_livekit_domain:
        type: "str"
        description: "The domain name for the livekit server. Used in the default caddy configuration."
      st_meet_livekit_turn_domain:
        type: "str"
        description: "The domain name for the livekit TURN server. Used in the default livekit and caddy configurations."
      st_meet_livekit_api_key:
        type: "str"
        description: "The API key for the livekit server. Used in the default livekit configuration."
      st_meet_livekit_api_secret:
        type: "str"
        description: "The API secret for the livekit server. Used in the default livekit configuration."
      st_meet_livekit_files:
        type: "list"
        elements: "dict"
        description: >
          List of files to deploy for the livekit application.
          By default deploys livekit.yaml, caddy.yaml and valkey_config/valkey.conf from the default templates.
          Override this entirely to deploy a custom livekit configuration.
        default:
          - { src: "livekit/livekit.default.yaml.j2", dest: "livekit.yaml" }
          - { src: "livekit/caddy.default.yaml.j2", dest: "caddy.yaml" }
          - { src: "livekit/valkey.default.conf.j2", dest: "valkey_config/valkey.conf", when: "{{ st_meet_livekit_valkey_enabled }}" }
      st_meet_livekit_directories:
        type: "list"
        elements: "dict"
        description: >
          List of directories to create for the livekit application.
          By default creates caddy_data for the caddy file_system storage module.
          Override this entirely for custom setups.
        default:
          - { name: "caddy_data" }
          - { name: "valkey_data", container_uid: "999", when: "{{ st_meet_livekit_valkey_enabled }}" }
          - { name: "valkey_config", when: "{{ st_meet_livekit_valkey_enabled }}" }
      st_meet_egress_image:
        type: "str"
        description: "Image repository for livekit egress."
        default: "docker.io/livekit/egress"
      st_meet_egress_tag:
        type: "str"
        description: "Tag of the livekit egress docker image to deploy."
        # renovate: datasource=docker depName=docker.io/livekit/egress
        default: "v1.13.0"
      st_meet_egress_cpus:
        type: "str"
        description: "Optional CPU limit for the livekit egress container (podman-compose `cpus`, e.g. '2' or '1.5'). Recommended on single-node setups so starting a recording (CPU-heavy transcoding) cannot starve the livekit server. Empty means no limit."
        default: ""
      st_meet_egress_memory:
        type: "str"
        description: "Optional memory limit for the livekit egress container (podman-compose `mem_limit`, e.g. '2g'). Recommended on single-node setups so a recording cannot OOM the node and take down the livekit server. Empty means no limit."
        default: ""
      st_meet_egress_enabled:
        type: "bool"
        description: "Triggers the installation of the livekit egress recorder as a separate component."
        default: false
      st_meet_egress_dir:
        type: "str"
        description: "Remote path to the base directory for the egress app."
        default: "/opt/meet/egress"
      st_meet_egress_compose_template:
        type: "str"
        description: "Local path to the custom template to use for the egress compose file."
        default: "egress/compose.yaml.j2"
      st_meet_egress_rollback_enabled:
        type: "bool"
        description: "Whether or not to trigger the rollback tasks if the egress deployment fails."
        default: false
      st_meet_egress_files:
        type: "list"
        elements: "dict"
        description: >
          List of files to deploy for the egress application.
          By default deploys egress.yaml from the default template.
          Override this entirely to deploy a custom egress configuration.
        default:
          - { src: "egress/egress.yaml.j2", dest: "egress.yaml" }
      st_meet_cadvisor_image:
        type: "str"
        description: "Image repository for the cadvisor container."
        default: "ghcr.io/google/cadvisor"
      st_meet_cadvisor_tag:
        type: "str"
        description: "Tag of the cadvisor docker image to deploy."
        # renovate: datasource=docker depName=ghcr.io/google/cadvisor
        default: "v0.60.5"
      st_meet_cadvisor_enabled:
        type: "bool"
        description: "Triggers the installation of the cadvisor container, used to send metrics to a Prometheus compatible server and logs to a Loki server."
        default: false
      st_meet_cadvisor_port:
        type: "str"
        description: "The host published port of the cadvisor container."
        default: "127.0.0.1:50399"
