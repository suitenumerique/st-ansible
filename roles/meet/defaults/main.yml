---
# Automatically generated by aar-doc
# UID of the `meet` user, used for the podman role.
st_meet_uid: 1103
# GID of the `meet` group, used for the podman role.
st_meet_gid: '{{ st_meet_uid }}'
# Triggers the installation of meet.
st_meet_enabled: false
# Remote path to the base directory for meet app.
st_meet_dir: /opt/meet/meet
# The host published port for the meet frontend.
st_meet_port: '50300'
# Image repository for the meet frontend.
st_meet_frontend_image: docker.io/lasuite/meet-frontend
# Image repository for the meet backend.
st_meet_backend_image: docker.io/lasuite/meet-backend
# Tag of the meet docker image to deploy.
st_meet_tag: v1.21.0
# Local path to the custom template to use for meet env file.
st_meet_backend_env_template: meet/backend_env.j2
# Content of the default backend_env_template, not used if st_meet_backend_env_template is defined.
st_meet_backend_env: ''
# Whether to run database migrations on meet backend startup.
st_meet_backend_run_migrations: true
# Local path to the custom template to use for meet frontend env file.
st_meet_frontend_env_template: meet/frontend_env.j2
# Content of the default frontend_env_template, not used if st_meet_frontend_env_template is defined.
st_meet_frontend_env: ''
# Local path to the custom template to use for meet compose file.
st_meet_compose_template: meet/compose.yaml.j2
# Whether or not to trigger the rollback tasks if the meet deployment fails.
st_meet_rollback_enabled: false
# Image repository for livekit caddyl4.
st_meet_livekit_caddyl4_image: docker.io/livekit/caddyl4
# Image repository for the livekit server.
st_meet_livekit_image: docker.io/livekit/livekit-server
# Image repository for livekit egress.
st_meet_livekit_egress_image: docker.io/livekit/egress
# Image repository for the livekit valkey.
st_meet_livekit_valkey_image: docker.io/valkey/valkey
# Tag of the livekit docker image to deploy.
st_meet_livekit_tag: v1.13.2
# Tag of the livekit egress docker image to deploy.
st_meet_livekit_egress_tag: v1.13.0
# Tag of the livekit caddyl4 docker image to deploy.
st_meet_livekit_caddyl4_tag: v2.11.3
# Tag of the valkey docker image to deploy for livekit when using the full compose template.
st_meet_livekit_valkey_tag: 9.0.4
# Triggers the installation of livekit.
st_meet_livekit_enabled: false
# Remote path to the base directory for livekit app.
st_meet_livekit_dir: /opt/meet/livekit
# Local path to the custom template to use for the livekit compose file.
st_meet_livekit_compose_template: livekit/compose.default.yaml.j2
# Whether or not to trigger the rollback tasks if the livekit deployment fails.
st_meet_livekit_rollback_enabled: false
# List of files to deploy for the livekit application. By default deploys livekit.yaml, caddy.yaml and redis.conf from the default templates. Override this entirely to deploy a custom livekit configuration.
st_meet_livekit_files:
  - {src: livekit/livekit.default.yaml.j2, dest: livekit.yaml}
  - {src: livekit/caddy.default.yaml.j2, dest: caddy.yaml}
  - {src: livekit/valkey.default.conf.j2, dest: valkey_config/valkey.conf}
  - {src: livekit/egress.default.yaml.j2, dest: egress.yaml}
# List of directories to create for the livekit application. By default creates caddy_data for the caddy file_system storage module. Override this entirely for custom setups.
st_meet_livekit_directories:
  - {name: caddy_data}
  - {name: valkey_data, container_uid: '999'}
  - {name: valkey_config}
# Image repository for the cadvisor container.
st_meet_cadvisor_image: ghcr.io/google/cadvisor
# Tag of the cadvisor docker image to deploy.
st_meet_cadvisor_tag: v0.60.3
# Triggers the installation of the cadvisor container, used to send metrics to a Prometheus compatible server and logs to a Loki server.
st_meet_cadvisor_enabled: false
# The host published port of the cadvisor container.
st_meet_cadvisor_port: '127.0.0.1:50399'
