---
- name: "Warn that mta-in is deprecated."
  ansible.builtin.debug:
    msg: >-
      mta-in (Postfix) is deprecated and will be removed in a future release.
      Set st_messages_pymta_enabled and unset st_messages_mta_in_enabled.
      See docs/04-messages/06-pymta.md.

- name: "Create mta-in application."
  ansible.builtin.import_role:
    name: suitenumerique.st.podman
    tasks_from: application.yml
  vars:
    st_podman_user: "messages"
    st_podman_application_name: "mta-in"
    st_podman_application_dir: "{{ st_messages_mta_in_dir }}"
    st_podman_application_rollback_enabled: "{{ st_messages_mta_in_rollback_enabled }}"
    st_podman_application_compose_template: "{{ st_messages_mta_in_compose_template }}"
    st_podman_application_files:
      - src: "{{ st_messages_mta_in_env_template }}"
        dest: "env"
