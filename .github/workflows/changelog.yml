---
name: Changelog
permissions:
  contents: read
on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install antsibull-changelog

      - name: Lint changelog fragments
        run: |
          antsibull-changelog lint

      - name: Require a changelog fragment change
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          base="origin/${{ github.base_ref }}"
          # A normal PR adds a fragment; a release PR consumes them
          # (make changelog.release deletes fragments).
          changed=$(git diff --name-only "$base...HEAD" -- 'changelogs/fragments/')
          if [ -z "$changed" ]; then
            echo "::error::No changelog fragment added or consumed."
            echo "Add a fragment:  make changelog.fragment name=<slug>"
            echo "For changes that shouldn't appear in the changelog, add a 'trivial:' fragment."
            exit 1
          fi
          echo "Fragment changes:"
          echo "$changed"
