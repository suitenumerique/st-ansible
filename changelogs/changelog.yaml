  0.6.0:
    changes:
      minor_changes:
      - Update clamav/clamav Docker tag to v1.5.4
      - Update docker.io/rspamd/rspamd Docker tag to v4.2.2
      - 'cli: add ``conversations`` app support to bootstrap: discrete ``DB_*`` database
        prompts, the ``AI_BASE_URL`` / ``AI_MODEL`` / ``AI_API_KEY`` LLM provider
        prompts, and ``CELERY_RESULT_BACKEND`` derived from ``REDIS_URL``.'
      - 'cli: transfers'' task broker is ``WORKER_BROKER_URL``, written from the same
        secret as ``REDIS_URL``; the other Django apps keep ``CELERY_BROKER_URL``.
        The broker needs a Redis 7 or later with eviction disabled, and the release
        flag tells the operator to delete the obsolete ``CELERY_BROKER_URL`` line,
        which the env merge never removes.'
      - 'conversations: add a ``conversations`` role that deploys the Conversations
        application (suitenumerique/conversations) as a caddy + frontend + backend
        core with a workers sub-app on the rootless podman base, with optional LLM
        catalog and theme files, and documents the celery beat periodic jobs.'
      - 'file-scanner: the worker healthcheck runs the upstream ``python -m health``
        module, which sends a dramatiq ping on a queue only that container consumes
        and waits for the answer, instead of a plain broker ping. It covers the consumer,
        a worker thread and the result backend too, so a worker wedged on a reachable
        broker is now reported unhealthy. It needs podman-compose 1.5.0 or later,
        and file-scanner 0.4.0, which the role now pins (up from 0.3.0: Python 3.14.8
        for CVE-2026-19445 and CVE-2026-19553, and the healthcheck module).'
      - 'messages: deploy the ``classifier-bayes.conf`` rspamd template in the mpa
        app, with autolearn enabled and ``min_learns`` set to 100.'
      - 'messages: the mpa app can run exav instead of clamav behind rspamd. Set ``st_messages_mpa_antivirus_engine``
        to ``exav`` and point ``st_messages_mpa_exav_db_url`` at a prebuilt ``.exavdb``;
        rspamd keeps its clamav-type antivirus module because exav speaks the clamd
        protocol. clamav stays the default.'
      - 'transfers: move the workers unit to dramatiq, following upstream 0.5.0, which
        drops celery, celery beat and Flower. The probe is now ``python worker.py
        --ping``, a dramatiq ping on the queue of that container alone, where ``celery
        inspect ping`` was a broker broadcast another host''s worker could answer.
        The periodic schedules run inside the worker and a Redis lock elects one to
        fire them, so the unit no longer has to be confined to a single host. Pins
        ``st_transfers_tag`` to 0.5.0.'
      release_summary: 'Adds the Conversations application, deployable end to end
        with st-cli.

        Moves the transfers workers to dramatiq, following upstream 0.5.0, which

        drops celery: the broker is now ``WORKER_BROKER_URL``, which an upgrade flag

        replays. Probes the file-scanner worker with the upstream dramatiq

        healthcheck and pins file-scanner 0.4.0. The messages mpa app can run exav

        instead of clamav behind rspamd, and deploys the rspamd bayes classifier

        config. Bumps clamav 1.5.4 and rspamd 4.2.2.

        '
    fragments:
    - conversations.yml
    - file-scanner-worker-health.yml
    - messages-bayes.yml
    - messages-exav.yml
    - release_summary.yml
    - renovate-pr-115.yml
    - renovate-pr-116.yml
    - transfers-dramatiq.yml
    release_date: '2026-10-26'
  0.7.0:
    changes:
      breaking_changes:
      - docs, drive, meet and messages roles - the role now manages `<app dir>/secrets`
        and deletes it when the secret file list is empty. If you used a custom `secrets`
        directory, move it to the new `*_secret_files` variables.
      minor_changes:
      - Update aar-doc to v2.4.0
      - Update actions/setup-python digest to 6d4fd22
      - Update dependency collabora/code to 26.04.3.2.1
      - Update dependency containers.podman to v1.21.2
      - Update dependency pytest-mock to v3.17.0
      - Update dependency suitenumerique/drive to v0.25.3
      - Update dependency suitenumerique/meet to v1.36.3
      - Update docker.io/livekit/egress Docker tag to v1.15.0
      - Update docker.io/livekit/livekit-server Docker tag to v1.13.10
      - Update docker/login-action digest to 81c6f93
      - 'cli: the bootstrap of conversations, drive, messages and transfers sets ``st_<app>_workers_beat_enabled``
        so that beat runs on the first workers play host only.'
      - 'conversations, drive, messages, transfers: add a ``st_<app>_workers_beat_enabled``
        variable (default ``true``) that controls the Celery beat scheduler embedded
        in the workers container. Set it to ``false`` on every workers host except
        one to scale the workers without duplicate periodic tasks.'
      - docs, drive, meet and messages roles - add `st_docs_backend_secret_files`,
        `st_docs_workers_secret_files`, `st_drive_backend_secret_files`, `st_drive_workers_secret_files`,
        `st_meet_backend_secret_files`, `st_messages_backend_secret_files` and `st_messages_workers_secret_files`.
        The role mounts the secret files at `/run/secrets` and sets `<ENV>_FILE` in
        the compose file.
      - podman role - add `st_podman_application_secret_files_container_uid` (default
        0). It sets the owner uid, inside the container, of `secrets` and of each
        secret file. A non-zero uid sets the mode of `secrets` to 2770.
      - 'podman role - add `st_podman_application_secret_files`. The role writes each
        `{env, src|content}` item to `secrets/<env>`, deletes stale files, and removes
        the directory when the list is empty. The role manages `secrets` only when
        the variable is defined. The name `secrets` is reserved: the role fails if
        `st_podman_application_directories` or `st_podman_application_files` uses
        it.'
      - podman role - add the `content` key to the items of `st_podman_application_files`.
        It writes an inline string instead of a `src` template.
      - podman role - add the `no_log` key to the items of `st_podman_application_files`.
        It hides the value from the task output and the diff.
      release_summary: 'Allow user to deploy secrets as files on supported apps. Adds
        the

        `st_<app>_workers_beat_enabled` on related roles to run beat on one celery
        host.

        Meet 1.36.0, Drive 0.25.3, Collabora 26.04.5.2.1, and multiple minor upgrades.

        '
      security_fixes:
      - st-cli hashivault and full extras - require certifi>=2026.10.19 to distrust
        the compromised eMudhra intermediate CAs (CVE-2026-111943).
      - st-cli image - move to Python 3.14.10 (CVE-2026-115557, CVE-2026-114583) and
        Alpine ca-certificates 20261020-r0 (CVE-2026-111943) to distrust the compromised
        eMudhra intermediate CAs.
    fragments:
