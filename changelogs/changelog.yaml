ancestor: null
releases:
  0.1.0:
    changes:
      major_changes:
      - (cli) added st-cli \#27
      - (roles) refactor every uid, gid and ports to allow single-host deployments
        \#26
      minor_changes:
      - (changelog) added antsibull-changelog config, Makefile targets and CI job
        \#13
      release_summary: 'Added st-cli to manage LST environments bootstraps and deployments,
        refactored roles to make single-host deployments easier, started the CHANGELOG
        dance.

        '
    fragments:
    - add-antsibull-changelog.yml
    - add-st-cli.yml
    - refactor-single-host-deployments.yml
    - release_summary.yml
    release_date: '2026-07-21'
  0.1.1:
    changes:
      bugfixes:
      - Fixed restic install task for upgrade workflow
      minor_changes:
      - Added Renovate configuration (``renovate.json5``) and renovate Makefile target
      - Pinned the st-cli and molecule-lima Python dependencies to exact versions
      - Update actions/checkout action to v7
      - Update dependency restic/restic to v0.19.1
      - Update docker/build-push-action action to v7
      - Update docker/login-action action to v4
      - Update docker/metadata-action action to v6
      - Update docker/setup-buildx-action action to v4
      - Update docker/setup-qemu-action action to v4
    fragments:
    - add-renovate.yml
    - fix-restic-upgrade.yml
    - renovate-pr-33.yml
    - renovate-pr-34.yml
    - renovate-pr-35.yml
    - renovate-pr-36.yml
    - renovate-pr-37.yml
    - renovate-pr-38.yml
    - renovate-pr-42.yml
    release_date: '2026-07-22'
  0.2.0:
    changes:
      bugfixes:
      - (cli) allow @openbao markers on non-secret fields
      minor_changes:
      - (meet) added custom logo handling
      - (meet) separated egress component and added recording feature to bootstrap
      - Update actions/checkout digest to 3d3c42e
      - Update actions/setup-python action to v7
      - Update dependency ansible.posix to v2.2.2
      - Update dependency containers.podman to v1.20.2
      - Update dependency suitenumerique/meet to v1.23.0
      - Update docker.io/livekit/livekit-server Docker tag to v1.13.4
      - Update docker/login-action digest to abd2ef4
      release_summary: 'Adds support for meet recordings, fix openbao markers on st-cli
        bootstrap

        and multiple versions upgrades.

        '
    fragments:
    - fix-cli-openbao-backend.yml
    - meet-recordings.yml
    - release_summary.yml
    - renovate-pr-30.yml
    - renovate-pr-40.yml
    - renovate-pr-41.yml
    - renovate-pr-44.yml
    - renovate-pr-46.yml
    - renovate-pr-48.yml
    - renovate-pr-55.yml
    release_date: '2026-07-26'
  0.2.1:
    changes:
      minor_changes:
      - (callback) added the suitenumerique.st.compact stdout callback, one line per
        task and host, a live progress line on a TTY, diffs for changed tasks, and
        full default-style error output
      - (cli) the generated ansible.cfg now selects suitenumerique.st.compact as the
        stdout callback
      - (cli) the generated ansible.cfg silences the Python interpreter discovery
        warning with `interpreter_python = auto_silent`
    fragments:
    - cli-ansible-summary.yml
    release_date: '2026-08-05'
  0.2.2:
    changes:
      bugfixes:
      - (cli) only push latest on new tags to follow the st-cli collection tags
      - (plugins) the compact callback no longer concatenates the pending task lines
        on one row when a task runs on multiple hosts, and it keeps a live pending
        line while other hosts still run
      minor_changes:
      - (cli) `st-cli upgrade` now checks upstream first and, without pipx (container
        installs), tells the user to run `docker pull ghcr.io/suitenumerique/st-cli:latest`
        and re-run `st-cli upgrade` instead of the pip hint
      - "(cli) the behind-upstream warning on other commands now branches on pipx
        \u2014 without pipx it names the exact `docker pull ghcr.io/suitenumerique/st-cli:latest`
        command to run before `st-cli upgrade`"
      - (plugins) the compact callback now prints the `msg` of a `debug` task in a
        green box in place of the ok line and the JSON dump
      - Update docker.io/clamav/clamav Docker tag to v1.5.4
      - Update docker.io/rspamd/rspamd Docker tag to v4.1.4
      - Update docker.io/valkey/valkey Docker tag to v9.1.1
      - Update docker/login-action digest to dbcb813
    fragments:
    - cli-latest-tags.yml
    - cli-upgrade-container.yml
    - compact-debug-box.yml
    - compact-multi-host-pending.yml
    - renovate-pr-49.yml
    - renovate-pr-61.yml
    - renovate-pr-64.yml
    - renovate-pr-66.yml
    release_date: '2026-08-10'
