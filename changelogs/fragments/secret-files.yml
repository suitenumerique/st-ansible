minor_changes:
  - "podman role - add the `content` key to the items of `st_podman_application_files`. It writes an inline string instead of a `src` template."
  - "podman role - add the `no_log` key to the items of `st_podman_application_files`. It hides the value from the task output and the diff."
  - "podman role - add `st_podman_application_secret_files`. The role writes each `{env, src|content}` item to `secrets/<env>`, deletes stale files, and removes the directory when the list is empty. The role manages `secrets` only when the variable is defined. The name `secrets` is reserved: the role fails if `st_podman_application_directories` or `st_podman_application_files` uses it."
  - "podman role - add `st_podman_application_secret_files_container_uid` (default 0). It sets the owner uid, inside the container, of `secrets` and of each secret file. A non-zero uid sets the mode of `secrets` to 2770."
  - "docs, drive, meet and messages roles - add `st_docs_backend_secret_files`, `st_docs_workers_secret_files`, `st_drive_backend_secret_files`, `st_drive_workers_secret_files`, `st_meet_backend_secret_files`, `st_messages_backend_secret_files` and `st_messages_workers_secret_files`. The role mounts the secret files at `/run/secrets` and sets `<ENV>_FILE` in the compose file."
breaking_changes:
  - "docs, drive, meet and messages roles - the role now manages `<app dir>/secrets` and deletes it when the secret file list is empty. If you used a custom `secrets` directory, move it to the new `*_secret_files` variables."
