minor_changes:
  - "file_scanner: the clamav container is now configurable through a new ``st_file_scanner_clamav_env`` blob, empty by default and falling back to the
    role's built-in tuning (the image maps ``CLAMD_CONF_<Option>``/``FRESHCLAM_CONF_<Option>`` lines onto clamd.conf/freshclam.conf). The default raises clamd's size caps (``StreamMaxLength``/``MaxFileSize``/``MaxScanSize`` to 2200M) above the scanner's 2 GiB ``MAX_URL_SIZE`` — with clamd's stock limits a big file either failed mid-INSTREAM on every retry or, above MaxFileSize/MaxScanSize, was skipped and reported clean without being scanned."
  - "file_scanner: optional second malware engine - ``st_file_scanner_exav_enabled``
    adds an exav daemon (``ghcr.io/sylvinus/exav``) to the compose unit, on the clamd
    protocol like clamav. Deploying it changes no verdict by itself: the application
    reaches it once ``EXAV_HOSTS`` and ``DEFAULT_SCANNERS`` name it in
    ``st_file_scanner_env``. It ships no signature database, so point
    ``EXAV_DB_URL`` at a prebuilt ``.exavdb`` (loads in seconds); without it the daemon
    waits for signatures and stays unhealthy, which is why the API and the worker are
    ordered after exav but never gated on its health. Compiling the signatures the
    bundled clamav keeps fresh is the other path, at ~3.6 GB of RAM on every start and
    a raised ``st_file_scanner_timeout``.
    The clamav defaults also gain ``MaxScanTime`` and ``AlertExceedsMax``, without which
    clamd answers OK on a scan it could not finish and the file is reported clean
    unscanned."
  - "podman role: the application start script now fails when ``podman-compose up -d``
    created fewer containers than the compose file declares. It can exit 0 having
    skipped a service whose ``depends_on`` it gave up waiting for, and the unit then
    reported every container healthy with half the stack missing - a file-scanner whose
    API and worker were never created while systemd showed the service as running."
