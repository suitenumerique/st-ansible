---
breaking_changes:
  - 'keycloak: the default compose template sets ``PORT`` instead of ``KC_HTTP_PORT``, because the ``messages-keycloak`` image now runs Caddy in front of Keycloak and Caddy owns the public port. The role requires image tag 0.10.0 or later (messages PR #793), and the default tag is now 0.10.0. A custom ``st_keycloak_compose_template`` must set ``PORT``, ``KC_HTTP_PORT`` and ``KC_HTTP_MANAGEMENT_PORT`` too.'
minor_changes:
  - 'keycloak: document the ``KEYCLOAK_ADMIN_IP_ALLOWLIST`` and ``KEYCLOAK_TRUSTED_PROXIES`` variables of the image, and the host ports the image binds with ``network_mode: host``.'
  - 'cli: the keycloak env template no longer sets ``KC_HTTP_ENABLED`` and ``KC_PROXY_HEADERS``, because the image sets them. The rendered env requires image tag 0.10.0 or later.'
  - 'keycloak: add ``st_keycloak_http_port`` (default ``50201``) and ``st_keycloak_management_port`` (default ``50202``). The default compose template sets ``KC_HTTP_PORT`` and ``KC_HTTP_MANAGEMENT_PORT`` from them, so with ``network_mode: host`` Keycloak listens on ``127.0.0.1:50201`` behind Caddy and the management interface (``/health``, ``/metrics``) listens on ``50202`` instead of ``9000``, inside the ``502xx`` block of the collection port scheme. Update firewall rules and Prometheus scrape targets that used port ``9000``. The compose ``environment`` block sets ``PORT``, ``KC_HTTP_PORT`` and ``KC_HTTP_MANAGEMENT_PORT`` and overrides these keys in ``st_keycloak_env``; use the role variables instead.'
