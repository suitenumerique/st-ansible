---
minor_changes:
  - 'podman: the role installs podman-compose ``1.6.0-1``, resolved on snapshot.debian.org from ``st_podman_compose_version``, instead of the trixie package 1.3.0. The role installs a package from an operator URL when you set ``st_podman_compose_deb_url`` and ``st_podman_compose_deb_checksum``. The checksum is required. Version 1.3.0 runs every compose healthcheck through ``/bin/sh -c``; 1.5.0 and later exec a ``CMD`` list directly, so images without a shell can have a healthcheck. The install step does not restart any unit; a container gets the new form when its unit restarts. A host that already has a newer version keeps it.'
  - 'messages: the workers compose template runs the Celery ping healthcheck as a ``CMD`` list instead of ``CMD-SHELL``, so it works with the distroless backend image that has no shell. With podman-compose 1.3.0 the list still runs through ``/bin/sh``, so the behavior on a host that keeps 1.3.0 is unchanged.'
  - 'file-scanner: the worker gets a healthcheck that pings the dramatiq broker (``redis.from_url(config.get_settings().worker_broker_url).ping()``), run as a ``CMD`` list in the distroless image. Until now the worker had no probe at all, so a worker left running and silent on an unreachable ``WORKER_BROKER_URL`` counted as healthy and the async scans never completed. dramatiq exposes no worker ping, so this checks the broker connection, not the consumer. It requires podman-compose 1.5.0 or later; on a host that keeps 1.3.0 the probe is wrapped in ``/bin/sh -c``, which the image has no shell for, and the unit does not start.'
  - 'transfers: the worker gets the Celery ping healthcheck as a ``CMD`` list, replacing ``healthcheck: disable: true``. The probe was disabled because podman-compose 1.3.0 wraps even a ``CMD`` list in ``/bin/sh -c``, which the distroless backend image has no shell for; 1.5.0 and later exec it directly. The ping is a broadcast on the broker, so with several hosts on one Redis another host''s worker can answer for this one.'
  - 'drive: the backend healthcheck passes the ``Host`` header without inner quotes. podman-compose 1.5.0 and later exec the ``CMD`` list without a shell, so the quotes reached ``wget`` and the probe failed.'
