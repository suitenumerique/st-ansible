minor_changes:
  - (cli) `st-cli upgrade` now checks upstream first and, without pipx (container installs), tells the user to run `docker pull ghcr.io/suitenumerique/st-cli:latest` and re-run `st-cli upgrade` instead of the pip hint
  - (cli) the behind-upstream warning on other commands now branches on pipx — without pipx it names the exact `docker pull ghcr.io/suitenumerique/st-cli:latest` command to run before `st-cli upgrade`
