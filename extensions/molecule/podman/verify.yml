---
- name: Verify
  hosts: instance
  become: true
  vars:
    secret_content: |
      -----BEGIN TEST KEY-----
      line one
      line two
      -----END TEST KEY-----
    secret_container: "testapp_redis_1"
  tasks:
    - name: "Verify podman package is installed"
      ansible.builtin.package_facts:
        manager: auto

    - name: "Assert podman package is installed"
      ansible.builtin.assert:
        that:
          - "'podman' in ansible_facts.packages"
        fail_msg: "podman package is not installed."
        success_msg: "podman package is installed."

    - name: "Assert podman-compose package is installed"
      ansible.builtin.assert:
        that:
          - "'podman-compose' in ansible_facts.packages"
        fail_msg: "podman-compose package is not installed."
        success_msg: "podman-compose package is installed."

    # A namespace keeps these defaults from overriding the vars of the role imports below.
    - name: "Read the podman role defaults"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../roles/podman/defaults/main.yml"
        name: podman_defaults

    - name: "Compare the installed podman-compose version with the pinned version"
      ansible.builtin.command:
        argv:
          - dpkg
          - --compare-versions
          - "{{ ansible_facts.packages['podman-compose'][0].version }}"
          - ge
          - "{{ podman_defaults.st_podman_compose_version }}"
      register: podman_compose_version_check
      changed_when: false
      failed_when: podman_compose_version_check.rc > 1

    - name: "Assert podman-compose has the pinned version or a newer one"
      ansible.builtin.assert:
        that:
          - podman_compose_version_check.rc == 0
        fail_msg: "podman-compose version is {{ ansible_facts.packages['podman-compose'][0].version }}, older than {{ podman_defaults.st_podman_compose_version }}."
        success_msg: "podman-compose version is {{ ansible_facts.packages['podman-compose'][0].version }}."

    - name: "Verify testuser exists"
      ansible.builtin.user:
        name: "testuser"
      register: testuser_info

    - name: "Assert testuser exists with correct uid"
      ansible.builtin.assert:
        that:
          - testuser_info.uid == 1100
          - testuser_info.group == 1100
          - testuser_info.home == "/opt/testuser"
          - testuser_info.shell == "/bin/bash"
        fail_msg: "testuser is not configured correctly."
        success_msg: "testuser is configured correctly."

    - name: "Verify testuser home directories"
      ansible.builtin.stat:
        path: "{{ item }}"
      register: testuser_dirs
      failed_when: false
      loop:
        - "/opt/testuser"
        - "/opt/testuser/.config/containers"
        - "/opt/testuser/.config/systemd/user"

    - name: "Assert testuser home directories exist"
      ansible.builtin.assert:
        that:
          - item.stat.exists
        fail_msg: "Directory {{ item.item }} does not exist."
        success_msg: "Directory {{ item.item }} exists."
      loop: "{{ testuser_dirs.results }}"

    - name: "Verify containers.conf exists"
      ansible.builtin.stat:
        path: "/opt/testuser/.config/containers/containers.conf"
      register: containers_conf

    - name: "Assert containers.conf exists"
      ansible.builtin.assert:
        that:
          - containers_conf.stat.exists
        fail_msg: "containers.conf does not exist."
        success_msg: "containers.conf exists."

    - name: "Verify podman.socket is enabled for testuser"  # noqa: command-instead-of-module
      become: true
      become_user: testuser
      become_method: ansible.builtin.sudo
      become_flags: "-i"
      ansible.builtin.command:
        cmd: "systemctl --user is-enabled podman.socket"
      register: podman_socket_enabled
      changed_when: false
      failed_when: false

    - name: "Verify podman.socket is active for testuser"  # noqa: command-instead-of-module
      become: true
      become_user: testuser
      become_method: ansible.builtin.sudo
      become_flags: "-i"
      ansible.builtin.command:
        cmd: "systemctl --user is-active podman.socket"
      register: podman_socket_active
      changed_when: false
      failed_when: false

    - name: "Assert podman.socket is enabled"
      ansible.builtin.assert:
        that:
          - podman_socket_enabled.rc == 0
        fail_msg: "podman.socket is not enabled for testuser."
        success_msg: "podman.socket is enabled for testuser."

    - name: "Assert podman.socket service is running"
      ansible.builtin.assert:
        that:
          - podman_socket_active.stdout == 'active'
        fail_msg: "podman.socket service is not running."
        success_msg: "podman.socket service is running."

    - name: "Verify linger is enabled for testuser"
      ansible.builtin.stat:
        path: "/var/lib/systemd/linger/testuser"
      register: linger_file

    - name: "Assert linger is enabled"
      ansible.builtin.assert:
        that:
          - linger_file.stat.exists
        fail_msg: "Linger is not enabled for testuser."
        success_msg: "Linger is enabled for testuser."

    - name: "Verify test application directory exists"
      ansible.builtin.stat:
        path: "/opt/testuser/testapp"
      register: testapp_dir

    - name: "Assert test application directory exists"
      ansible.builtin.assert:
        that:
          - testapp_dir.stat.exists
        fail_msg: "Test application directory does not exist."
        success_msg: "Test application directory exists."

    - name: "Verify test compose file exists"
      ansible.builtin.stat:
        path: "/opt/testuser/testapp/compose.yaml"
      register: test_compose_file

    - name: "Assert test compose file exists"
      ansible.builtin.assert:
        that:
          - test_compose_file.stat.exists
        fail_msg: "Test compose file does not exist."
        success_msg: "Test compose file exists."

    - name: "Verify systemd service for test application"  # noqa: command-instead-of-module
      become: true
      become_user: testuser
      become_method: ansible.builtin.sudo
      become_flags: "-i"
      ansible.builtin.command:
        cmd: "systemctl --user is-enabled testapp"
      register: testapp_enabled
      changed_when: false
      failed_when: false

    - name: "Verify systemd service for test application is running"  # noqa: command-instead-of-module
      become: true
      become_user: testuser
      become_method: ansible.builtin.sudo
      become_flags: "-i"
      ansible.builtin.command:
        cmd: "systemctl --user is-active testapp"
      register: testapp_active
      changed_when: false
      failed_when: false

    - name: "Assert test application service is enabled"
      ansible.builtin.assert:
        that:
          - testapp_enabled.stdout == 'enabled'
        fail_msg: "Test application service is not enabled."
        success_msg: "Test application service is enabled."

    - name: "Assert test application service is running"
      ansible.builtin.assert:
        that:
          - testapp_active.stdout == 'active'
        fail_msg: "Test application service is not running."
        success_msg: "Test application service is running."

    - name: "Verify compose file content"
      ansible.builtin.slurp:
        src: "/opt/testuser/testapp/compose.yaml"
      register: compose_content

    - name: "Assert compose file is not empty"
      ansible.builtin.assert:
        that:
          - compose_content.content | length > 0
        fail_msg: "Compose file is empty."
        success_msg: "Compose file is not empty."

    - name: "Verify application env file exists"
      ansible.builtin.stat:
        path: "/opt/testuser/testapp/config/app.env"
      register: app_env_file

    - name: "Assert application env file exists"
      ansible.builtin.assert:
        that:
          - app_env_file.stat.exists
        fail_msg: "Application env file does not exist."
        success_msg: "Application env file exists."

    - name: "Assert application env file has correct permissions"
      ansible.builtin.assert:
        that:
          - app_env_file.stat.mode | int == 640
        fail_msg: "Application env file has incorrect permissions."
        success_msg: "Application env file has correct permissions."

    - name: "Verify application config directory exists"
      ansible.builtin.stat:
        path: "/opt/testuser/testapp/config"
      register: app_config_dir

    - name: "Assert application config directory exists"
      ansible.builtin.assert:
        that:
          - app_config_dir.stat.exists
        fail_msg: "Application config directory does not exist."
        success_msg: "Application config directory exists."

    - name: "Verify application config directory permissions"
      ansible.builtin.stat:
        path: "/opt/testuser/testapp/config"
      register: app_config_dir_perms

    - name: "Assert application config directory has correct permissions"
      ansible.builtin.assert:
        that:
          - app_config_dir_perms.stat.mode | int == 2770
        fail_msg: "Application config directory has incorrect permissions."
        success_msg: "Application config directory has correct permissions."

    - name: "Verify application config file exists"
      ansible.builtin.stat:
        path: "/opt/testuser/testapp/config/app.config"
      register: app_config_file

    - name: "Assert application config file exists"
      ansible.builtin.assert:
        that:
          - app_config_file.stat.exists
        fail_msg: "Application config file does not exist."
        success_msg: "Application config file exists."

    - name: "Assert application config file has correct permissions"
      ansible.builtin.assert:
        that:
          - app_config_file.stat.mode | int == 660
        fail_msg: "Application config file has incorrect permissions."
        success_msg: "Application config file has correct permissions."

    - name: "Get subuid range for testuser"
      ansible.builtin.shell:
        cmd: "awk -F: '/^testuser:/ {print $2}' /etc/subuid"
      register: testuser_subuid_start
      changed_when: false
      failed_when: false

    - name: "Calculate expected container uid"
      ansible.builtin.set_fact:
        expected_container_uid: "{{ (testuser_subuid_start.stdout | int) + 999 - 1 }}"

    - name: "Assert application config file has correct owner"
      ansible.builtin.assert:
        that:
          - app_config_file.stat.uid == expected_container_uid | int
        fail_msg: "Application config file has incorrect owner."
        success_msg: "Application config file has correct owner."

    - name: "Assert application config file has correct group"
      ansible.builtin.assert:
        that:
          - app_config_file.stat.gid == 1100
        fail_msg: "Application config file has incorrect group."
        success_msg: "Application config file has correct group."

    - name: "Verify application config file content"
      ansible.builtin.slurp:
        src: "/opt/testuser/testapp/config/app.config"
      register: app_config_content

    - name: "Assert application config file content is correct"
      ansible.builtin.assert:
        that:
          - app_config_content.content | b64decode == "# this is a configuration\n"
        fail_msg: "Application config file content is incorrect."
        success_msg: "Application config file content is correct."

    - name: "Verify application env file content"
      ansible.builtin.slurp:
        src: "/opt/testuser/testapp/config/app.env"
      register: app_env_content

    - name: "Assert application env file content is correct"
      ansible.builtin.assert:
        that:
          - app_env_content.content | b64decode == "TEST_ENV_VAR=hello_world\nTEST_ANOTHER_VAR=12345\n"
        fail_msg: "Application env file content is incorrect."
        success_msg: "Application env file content is correct."

    - name: "Verify secrets directory"
      ansible.builtin.stat:
        path: "/opt/testuser/testapp/secrets"
      register: secrets_dir

    - name: "Assert secrets directory has mode 2770 and the container owner"
      ansible.builtin.assert:
        that:
          - secrets_dir.stat.isdir
          - secrets_dir.stat.mode | int == 2770
          - secrets_dir.stat.uid == expected_container_uid | int
          - secrets_dir.stat.gid == 1100
        fail_msg: "The secrets directory is missing or has incorrect permissions or owner."
        success_msg: "The secrets directory has correct permissions and owner."

    - name: "Verify secret files"
      ansible.builtin.stat:
        path: "/opt/testuser/testapp/secrets/{{ item }}"
      register: secret_files
      loop:
        - TEST_MULTILINE_SECRET
        - TEST_TEMPLATED_SECRET

    - name: "Assert secret files have mode 0440 and the container owner"
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.mode | int == 440
          - item.stat.uid == expected_container_uid | int
          - item.stat.gid == 1100
        fail_msg: "Secret file {{ item.item }} is missing or has incorrect permissions or owner."
        success_msg: "Secret file {{ item.item }} has correct permissions and owner."
      loop: "{{ secret_files.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: "Read secrets in the container as the non-root container user"
      become: true
      become_user: testuser
      become_method: ansible.builtin.sudo
      become_flags: "-i"
      ansible.builtin.command:
        cmd: "podman exec --user 999:999 {{ secret_container }} cat /run/secrets/{{ item }}"
      register: secret_reads
      changed_when: false
      retries: 10
      delay: 3
      until: secret_reads.rc == 0
      loop:
        - TEST_MULTILINE_SECRET
        - TEST_TEMPLATED_SECRET

    - name: "Assert the container reads the exact secret content"
      ansible.builtin.assert:
        that:
          - secret_reads.results[0].stdout + "\n" == secret_content
          - secret_reads.results[1].stdout == "templated-secret-for-testuser"
        fail_msg: "The secret content in the container is incorrect."
        success_msg: "The secret content in the container is correct."

    - name: "Read the _FILE variables in the container"
      become: true
      become_user: testuser
      become_method: ansible.builtin.sudo
      become_flags: "-i"
      ansible.builtin.command:
        cmd: "podman exec {{ secret_container }} printenv {{ item }}_FILE"
      register: secret_envs
      changed_when: false
      loop:
        - TEST_MULTILINE_SECRET
        - TEST_TEMPLATED_SECRET

    - name: "Assert the _FILE variables hold the secret paths"
      ansible.builtin.assert:
        that:
          - secret_envs.results[0].stdout == "/run/secrets/TEST_MULTILINE_SECRET"
          - secret_envs.results[1].stdout == "/run/secrets/TEST_TEMPLATED_SECRET"
        fail_msg: "The _FILE variables are incorrect."
        success_msg: "The _FILE variables are correct."

    - name: "Deploy test application again with one secret file removed"
      ansible.builtin.import_role:
        name: suitenumerique.st.podman
        tasks_from: application.yml
      vars:
        st_podman_user: "testuser"
        st_podman_application_name: "testapp"
        st_podman_application_compose_template: "test.compose.yml.j2"
        st_podman_application_directories:
          - name: config
        st_podman_application_files:
          - src: "test-app-env.j2"
            dest: "config/app.env"
            mode: "0640"
          - src: "test-app-config.j2"
            dest: "config/app.config"
            container_uid: "999"
        st_podman_application_secret_files_container_uid: "999"
        st_podman_application_secret_files:
          - env: TEST_TEMPLATED_SECRET
            content: "rewritten-secret"

    - name: "Verify the secret files after the removal"
      ansible.builtin.stat:
        path: "/opt/testuser/testapp/secrets/{{ item }}"
      register: secret_files_after_removal
      loop:
        - TEST_MULTILINE_SECRET
        - TEST_TEMPLATED_SECRET

    - name: "Assert only the removed secret file is deleted"
      ansible.builtin.assert:
        that:
          - not secret_files_after_removal.results[0].stat.exists
          - secret_files_after_removal.results[1].stat.exists
          - secret_files_after_removal.results[1].stat.uid == expected_container_uid | int
        fail_msg: "The stale secret file was not deleted, or the kept secret file is missing."
        success_msg: "The stale secret file is deleted."

    - name: "Read the rewritten secret file"
      ansible.builtin.slurp:
        src: "/opt/testuser/testapp/secrets/TEST_TEMPLATED_SECRET"
      register: rewritten_secret

    - name: "Assert the secret file owned by the container user is rewritten"
      ansible.builtin.assert:
        that:
          - rewritten_secret.content | b64decode == "rewritten-secret"
        fail_msg: "The secret file was not rewritten."
        success_msg: "The secret file is rewritten."

    - name: "Deploy test application again with no secret files"
      ansible.builtin.import_role:
        name: suitenumerique.st.podman
        tasks_from: application.yml
      vars:
        st_podman_user: "testuser"
        st_podman_application_name: "testapp"
        st_podman_application_compose_template: "test.compose.yml.j2"
        st_podman_application_directories:
          - name: config
        st_podman_application_files:
          - src: "test-app-env.j2"
            dest: "config/app.env"
            mode: "0640"
          - src: "test-app-config.j2"
            dest: "config/app.config"
            container_uid: "999"
        st_podman_application_secret_files_container_uid: "999"
        st_podman_application_secret_files: []

    - name: "Verify the secrets directory after the empty list"
      ansible.builtin.stat:
        path: "/opt/testuser/testapp/secrets"
      register: secrets_dir_after_empty

    - name: "Assert the secrets directory is deleted"
      ansible.builtin.assert:
        that:
          - not secrets_dir_after_empty.stat.exists
        fail_msg: "The secrets directory still exists."
        success_msg: "The secrets directory is deleted."
