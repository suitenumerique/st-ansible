---
- name: "Deploy egress."
  hosts: egress
  tasks:
    - name: "Install meet base."
      become: true
      become_user: root
      ansible.builtin.import_role:
        name: suitenumerique.st.meet

    # NOTE: Splitting in two tasks is not mandatory, you could also play
    # the whole thing as root by appending the variables on the first task.
    # This setup is useful for CI/CD pipelines without root access.
    - name: "Deploy egress application."
      become: true
      become_user: meet
      become_method: ansible.builtin.sudo
      become_flags: "-i"
      ansible.builtin.import_role:
        name: suitenumerique.st.meet
        tasks_from: deploy.yml
      vars:
        st_meet_egress_enabled: true
        st_meet_egress_rollback_enabled: true
        st_meet_egress_tag: vx.y.z # check https://hub.docker.com/r/livekit/egress/tags
        st_meet_egress_cpus: "2"
        st_meet_egress_memory: "2g"
        # dedicated-node topology: egress does not run on the livekit host(s), so it
        # shares an external redis with livekit instead of the co-located valkey.
        # See docs/03-meet/03-egress.md.
        st_meet_livekit_redis_address: redis.example.com:6379
        st_meet_livekit_redis_username: livekit
        st_meet_livekit_redis_password: changeme
        st_meet_livekit_domain: livekit.example.com
        st_meet_livekit_api_key: changeme
        st_meet_livekit_api_secret: changeme
        st_meet_cadvisor_enabled: true
