---
app: conversations
env_docs_url: "https://github.com/suitenumerique/conversations/blob/main/docs/env.md"
arch_docs_url: "https://github.com/suitenumerique/st-ansible/tree/main/docs/09-conversations"
requirements:
  - "[bold]IP[/bold] or hostname of the VM(s)"
  - "[bold]PostgreSQL[/bold] host and credentials"
  - "[bold]Redis[/bold] host and credentials"
  - "[bold]S3[/bold] endpoint, bucket and credentials"
  - "[bold]Identity provider[/bold] URLs and credentials (ProConnect Integration: create an app at https://partenaires.proconnect.gouv.fr/)"
  - "[bold]AI API[/bold] base URL, model name and API key (OpenAI-compatible, e.g. Albert)"
  - "[bold]Optionally[/bold]: SMTP credentials"
components:
  - key: conversations
    role: suitenumerique.st.conversations
    user: conversations
    app_name: conversations
    dir_var: st_conversations_dir
    enabled_var: st_conversations_enabled
    deploy_order: 20
    is_core: true
    # component-level ansible vars derived from questionnaire answers ({DOMAIN} etc.)
    vars:
      st_conversations_public_host: "{DOMAIN}"   # required by the conversations role (healthcheck Host header)
      # Run DB migrations only once across a multi-host deploy. Plays are serial:1,
      # so the role's run_once migrations task fires on every host — gate it to the
      # first play host. Braces are quadrupled so str.format emits literal {{ }}.
      st_conversations_backend_run_migrations: "{{{{ true if inventory_hostname == ansible_play_hosts_all[0] else false }}}}"
      # The workers play loads this file. Beat runs on its first play host only.
      st_conversations_workers_beat_enabled: "{{{{ true if inventory_hostname == ansible_play_hosts_all[0] else false }}}}"
    env_render:
      backend:
        blob_var: st_conversations_backend_env
        templates:
          - conversations.backend.env.j2
  - key: workers
    role: suitenumerique.st.conversations
    user: conversations
    app_name: workers
    dir_var: st_conversations_workers_dir
    enabled_var: st_conversations_workers_enabled
    deploy_order: 30
    is_core: false
    is_worker: true
dependencies: []
