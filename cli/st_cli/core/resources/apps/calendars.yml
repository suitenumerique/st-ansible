---
app: calendars
env_docs_url: "https://github.com/suitenumerique/calendars/tree/main/env.d/development"
arch_docs_url: "https://github.com/suitenumerique/st-ansible/tree/main/docs/10-calendars"
requirements:
  - "[bold]IP[/bold] or hostname of the VM(s)"
  - "[bold]PostgreSQL[/bold] host and credentials (the CalDAV server shares the database)"
  - "[bold]Redis[/bold] host and credentials"
  - "[bold]Identity provider[/bold] URLs and credentials (ProConnect Integration: create an app at https://partenaires.proconnect.gouv.fr/)"
  - "[bold]SMTP[/bold] credentials for the invitation emails"
components:
  - key: calendars
    role: suitenumerique.st.calendars
    user: calendars
    app_name: calendars
    dir_var: st_calendars_dir
    enabled_var: st_calendars_enabled
    deploy_order: 20
    is_core: true
    # component-level ansible vars derived from questionnaire answers ({DOMAIN} etc.)
    vars:
      st_calendars_public_host: "{DOMAIN}"
      # Run DB migrations only once across a multi-host deploy. Plays are serial:1,
      # so the role's run_once migrations task fires on every host — gate it to the
      # first play host. Braces are quadrupled so str.format emits literal {{ }}.
      st_calendars_backend_run_migrations: "{{{{ true if inventory_hostname == ansible_play_hosts_all[0] else false }}}}"
      st_calendars_messages_enabled: "{FEATURE_MESSAGES_INTEGRATION}"
      st_calendars_messages_api_url: "{MESSAGES_API_URL}"
      st_calendars_messages_channel_id: "{MESSAGES_CHANNEL_ID}"
      st_calendars_messages_api_key: "{MESSAGES_API_KEY}"
      # The workers play loads this file. The mailbox sync timer runs on its first play host only.
      st_calendars_workers_mailbox_sync_enabled: "{{{{ true if inventory_hostname == ansible_play_hosts_all[0] else false }}}}"
    env_render:
      backend:
        blob_var: st_calendars_backend_env
        templates:
          - calendars.backend.env.j2
      caldav:
        blob_var: st_calendars_caldav_env
        templates:
          - calendars.caldav.env.j2
  - key: workers
    role: suitenumerique.st.calendars
    user: calendars
    app_name: workers
    dir_var: st_calendars_workers_dir
    enabled_var: st_calendars_workers_enabled
    deploy_order: 30
    is_core: false
    is_worker: true
dependencies: []
