[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "st-cli"
version = "0.1.0"
description = "CLI wrapper to bootstrap and operate suitenumerique.st ansible deployments"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Agence nationale de la cohésion des territoires" }]
dependencies = [
    "typer==0.27.0",
    "questionary==2.1.1",
    "ruamel.yaml==0.19.1",
    "jinja2==3.1.6",
    "rich==15.0.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-mock==3.15.1"]
ansible = ["ansible-core==2.21.2"]
hashivault = ["hvac==2.4.0"]
full = ["ansible-core==2.21.2", "hvac==2.4.0"]

[project.scripts]
st-cli = "st_cli.main:app"

[tool.hatch.build.targets.wheel]
# hatchling includes ALL files under the package dir (incl. the apps/*.yml and
# *.j2 templates) — no force-include needed, and adding one would duplicate them.
packages = ["st_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
