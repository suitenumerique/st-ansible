[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "st-cli"
version = "0.4.0"
description = "CLI wrapper to bootstrap and operate suitenumerique.st ansible deployments"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Agence nationale de la cohésion des territoires" }]
dependencies = [
    "typer==0.27.2",
    "questionary==2.1.1",
    "ruamel.yaml==0.19.1",
    "jinja2==3.1.6",
    "rich==15.0.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-mock==3.15.1"]
ansible = ["ansible-core==2.21.3"]
hashivault = ["hvac==2.4.0"]
full = ["ansible-core==2.21.4", "hvac==2.4.0"]

[project.scripts]
st-cli = "st_cli.main:app"

[tool.hatch.build.targets.wheel]
# hatchling includes every file under the package dir, so the apps/*.yml and
# the *.j2 templates need no force-include.
packages = ["st_cli"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "B", "SIM", "PIE", "PERF", "ISC", "PLR0402", "PLW1510"]
# B008: typer.Option() in a default is the Typer idiom.
# UP042: StrEnum would change str() of ReplayAction and PinState.
ignore = ["B008", "UP042"]

[tool.pytest.ini_options]
testpaths = ["tests"]
